<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premiação · Ordens de Pagamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#14181f; --muted:#667085; --line:#e4e7ec;
  --brand:#0f5c4d; --brand-2:#e7f3f0; --warn:#b54708; --warn-bg:#fef0c7;
  --info:#175cd3; --info-bg:#d1e9ff; --ok:#067647; --ok-bg:#dcfae6; --bad:#b42318; --bad-bg:#fee4e2;
  --violet:#5925dc; --violet-bg:#ebe9fe; --r:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* layout */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
nav{display:flex;gap:4px;margin-left:12px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav button.on{background:var(--brand-2);color:var(--brand)}
.spacer{flex:1}
.who{color:var(--muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:20px;margin:0 0 16px}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:4px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)} .bar{flex-wrap:wrap} nav{order:3;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap} nav button{white-space:nowrap}}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
/* forms */
label{display:block;font-size:12px;font-weight:600;color:#344054;margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
.f{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.calc{background:var(--brand-2);border-radius:10px;padding:12px 14px;display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.calc div{font-size:12px;color:var(--muted)} .calc b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
/* table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select,.toolbar input{width:auto;min-width:170px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-enviada{background:var(--warn-bg);color:var(--warn)}
.st-nota_emitida{background:var(--info-bg);color:var(--info)}
.st-pago_cliente{background:var(--violet-bg);color:var(--violet)}
.st-concluida{background:var(--ok-bg);color:var(--ok)}
.st-cancelada{background:#f2f4f7;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:28px}
.login h1{margin-bottom:4px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:500}
/* modal */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:720px;max-height:92vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:14px;top:12px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin:0 0 16px}
.dl dt{color:var(--muted);font-size:13px} .dl dd{margin:0}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps div{flex:1;height:6px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--brand)}
.action{border:1px dashed var(--brand);background:#fbfdfc;border-radius:10px;padding:16px;margin-top:8px}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tl{list-style:none;padding:0;margin:0;font-size:13px}
.tl li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 16px;border-radius:10px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="vLogin" class="login hidden">
  <div class="card">
    <div class="logo" style="margin-bottom:18px"><i>P</i> Premiação</div>
    <h1 id="lgTitle">Entrar</h1>
    <p class="muted" id="lgSub" style="margin:0 0 18px">Acesse para enviar e acompanhar suas ordens de pagamento.</p>
    <div id="lgMsg"></div>
    <form id="lgForm">
      <div class="f"><label>E-mail</label><input id="lgEmail" type="email" required autocomplete="email"></div>
      <div class="f" id="lgPassBox"><label>Senha</label><input id="lgPass" type="password" minlength="6" autocomplete="current-password"></div>
      <button class="btn pri" style="width:100%;justify-content:center" id="lgBtn">Entrar</button>
    </form>
    <p class="small muted" style="margin:16px 0 0;display:flex;justify-content:space-between">
      <button class="link" data-mode="signup">Primeiro acesso</button>
      <button class="link" data-mode="reset">Esqueci a senha</button>
    </p>
  </div>
</section>

<!-- ===== SEM VÍNCULO ===== -->
<section id="vNoLink" class="login hidden">
  <div class="card">
    <h1>Acesso não liberado</h1>
    <p class="muted">O e-mail <b id="nlEmail"></b> ainda não está cadastrado como cliente. Peça ao administrador para cadastrar este e-mail e tente de novo.</p>
    <button class="btn" onclick="sair()">Sair</button>
  </div>
</section>

<!-- ===== APP ===== -->
<div id="vApp" class="hidden">
  <header><div class="bar">
    <div class="logo"><i>P</i> Premiação</div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn sm" onclick="sair()">Sair</button>
  </div></header>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card"><button class="x" onclick="fecharModal()">×</button><div id="modalBody"></div></div></div>

<script>
// ================= CONFIG =================
const SUPABASE_URL = 'https://cqfouldafqrtvjecespw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Q7oyyHqZZLSwC_Ah_UP_6A_EDaUirXy';
const BUCKET = 'premiacao';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ST = {
  enviada:      {l:'Aguardando nota', c:'Aguardando sua nota', step:1},
  nota_emitida: {l:'Aguardando pagamento do cliente', c:'Pagar a nota', step:2},
  pago_cliente: {l:'Pagar favorecido', c:'Nota paga · aguardando repasse', step:3},
  concluida:    {l:'Concluída', c:'Concluída', step:4},
  cancelada:    {l:'Cancelada', c:'Cancelada', step:0},
};
const S = { user:null, papel:null, clienteId:null, cliente:null, clientes:[], ordens:[], favs:[], custoTed:9, favCli:'', tab:null, filtro:{status:'acao', cliente:'', q:''} };
const PIX_TIPOS = {cpf:'CPF',cnpj:'CNPJ',email:'E-mail',telefone:'Telefone',aleatoria:'Chave aleatória'};
const soDig = s => String(s||'').replace(/\D/g,'');
const fmtDoc = s => { s=soDig(s); return s.length===11 ? s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : s.length===14 ? s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5') : s; };
function cpfValido(c){ c=soDig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  for(let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+=c[i]*(t+1-i); if(((s*10)%11)%10!=c[t]) return false; } return true; }
function cnpjValido(c){ c=soDig(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)==c[12] && calc(13)==c[13]; }
const favDados = f => f.forma_pagamento==='pix' ? `PIX · ${PIX_TIPOS[f.pix_tipo]||'Chave'}: ${f.pix_chave}` : `TED · Banco ${f.banco} · Ag ${f.agencia} · Conta ${f.conta}${f.tipo_conta?' ('+(f.tipo_conta==='poupanca'?'poupança':'corrente')+')':''}`;

// ================= UTIL =================
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct = v => Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3}) + '%';
const dt = v => v ? new Date(v).toLocaleDateString('pt-BR') : '—';
const dth = v => v ? new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—';
const dIso = v => v ? new Date(v+'T12:00:00').toLocaleDateString('pt-BR') : '—';
const pill = (s, cli) => `<span class="pill st-${s}">${esc(cli ? ST[s].c : ST[s].l)}</span>`;
function toast(m, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), err?6000:3000); }
function parseValor(s){ s=String(s).trim(); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); return Number(s)||0; }
function show(id){ ['vLogin','vNoLink','vApp'].forEach(v=>$('#'+v).classList.toggle('hidden', v!==id)); }
function abrirModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.remove('hidden'); }
function fecharModal(){ $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') fecharModal(); });
async function busy(btn, fn){ btn.disabled=true; const t=btn.textContent; btn.textContent='Aguarde…'; try{ await fn(); } catch(e){ console.error(e); toast(e.message||String(e), true); } finally{ btn.disabled=false; btn.textContent=t; } }

async function upload(clienteId, ordemId, tipo, file){
  if(!file) return null;
  if(file.size > 15*1024*1024) throw new Error('Arquivo maior que 15 MB.');
  const ext = (file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = `${clienteId}/${ordemId}/${tipo}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw error;
  return path;
}
async function abrirArquivo(path){
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300);
  if(error){ w && w.close(); return toast(error.message, true); }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

// ================= AUTH =================
let lgMode = 'login';
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=e=>{ e.preventDefault(); setLgMode(lgMode===b.dataset.mode?'login':b.dataset.mode); });
function setLgMode(m){
  lgMode=m; $('#lgMsg').innerHTML='';
  const cfg = { login:['Entrar','Acesse para enviar e acompanhar suas ordens de pagamento.','Entrar'],
    signup:['Primeiro acesso','Use o e-mail que você informou ao administrador e crie uma senha.','Criar senha'],
    reset:['Recuperar senha','Enviaremos um link para você criar uma nova senha.','Enviar link'] }[m];
  $('#lgTitle').textContent=cfg[0]; $('#lgSub').textContent=cfg[1]; $('#lgBtn').textContent=cfg[2];
  $('#lgPassBox').classList.toggle('hidden', m==='reset');
  document.querySelectorAll('[data-mode]').forEach(b=>b.textContent = (b.dataset.mode===m ? 'Voltar ao login' : (b.dataset.mode==='signup'?'Primeiro acesso':'Esqueci a senha')));
}
$('#lgForm').onsubmit = e => { e.preventDefault(); busy($('#lgBtn'), async ()=>{
  const email=$('#lgEmail').value.trim(), password=$('#lgPass').value;
  const msg=(t,ok)=>$('#lgMsg').innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`;
  if(lgMode==='reset'){
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
    return error?msg(error.message):msg('Se o e-mail existir, você receberá o link em instantes.',true);
  }
  if(!password || password.length<6) return msg('A senha precisa ter pelo menos 6 caracteres.');
  if(lgMode==='signup'){
    const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
    if(error) return msg(error.message.includes('already')?'Este e-mail já tem acesso. Use "Entrar" com a sua senha ou "Esqueci a senha".':error.message);
    if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
      setLgMode('login'); return msg('Este e-mail já tem acesso. Entre com a sua senha ou clique em "Esqueci a senha" para criar uma nova.');
    }
    if(!data.session) return msg('Conta criada! Confirme pelo link enviado ao seu e-mail (veja também o spam) e depois entre.',true);
    return iniciar();
  }
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return msg(error.message==='Invalid login credentials'?'E-mail ou senha inválidos.':error.message);
  iniciar();
});};
async function sair(){ await sb.auth.signOut(); location.reload(); }

sb.auth.onAuthStateChange(async (ev)=>{
  if(ev==='PASSWORD_RECOVERY'){
    show('vApp'); $('#nav').innerHTML=''; $('#main').innerHTML=`<div class="card" style="max-width:420px"><h2>Nova senha</h2>
      <div class="f"><label>Nova senha</label><input id="np" type="password" minlength="6"></div>
      <button class="btn pri" id="npBtn">Salvar</button></div>`;
    $('#npBtn').onclick=()=>busy($('#npBtn'),async()=>{ const {error}=await sb.auth.updateUser({password:$('#np').value}); if(error) throw error; toast('Senha alterada.'); iniciar(); });
  }
});

async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show('vLogin'); return; }
  S.user = session.user;
  const { data, error } = await sb.rpc('prem_vincular');
  if(error){ toast(error.message,true); show('vLogin'); return; }
  S.papel = data?.papel; S.clienteId = data?.cliente_id || null;
  if(!S.papel){ $('#nlEmail').textContent=S.user.email; show('vNoLink'); return; }
  show('vApp');
  $('#who').textContent = S.user.email + (S.papel==='admin'?' · admin':'');
  if(S.papel==='admin'){
    montarNav([['painel','Painel'],['ordens','Ordens'],['nova','Nova ordem'],['campanhas','Campanhas'],['clientes','Clientes'],['favorecidos','Favorecidos'],['faturamento','Faturamento'],['contrato','Contrato'],['equipe','Equipe']]);
    await carregar(); ir(S.tab||'painel');
  } else {
    const { data:c } = await sb.from('prem_clientes').select('*').eq('id',S.clienteId).single();
    S.cliente = c;
    const { data:cfgc } = await sb.from('prem_config').select('contrato_exigir').single();
    if(cfgc?.contrato_exigir && !c?.contrato_aceito_em){ $('#who').textContent = S.user.email; vContratoGate(); return; }
    montarNav([['minhas','Minhas ordens'],['nova','Nova ordem'],['campanhas','Campanhas'],['favorecidos','Favorecidos']].concat(c?.contrato_aceito_em?[['contrato','Contrato']]:[]));
    await carregar(); ir(S.tab||'minhas');
  }
}
function montarNav(items){
  $('#nav').innerHTML = items.map(([k,l])=>`<button data-tab="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>ir(b.dataset.tab));
}
function ir(tab){
  S.tab=tab; $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({painel:vPainel, ordens:vOrdens, clientes:vClientes, faturamento:vFaturamento, minhas:vMinhas, nova:vNova, favorecidos:vFavorecidos, campanhas:vCampanhas, equipe:vEquipe, contrato:()=>{ if(S.papel==='admin') vContratoAdmin(); else { S.tab='minhas'; vMinhas(); $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='minhas')); verContratoAssinado(S.clienteId); } }}[tab])();
}

// ================= DADOS =================
async function carregar(){
  const q = sb.from('prem_ordens').select('*, prem_clientes(nome), prem_campanhas(nome,numero)').order('created_at',{ascending:false}).limit(1000);
  const [o, c, f, cfg, cp] = await Promise.all([ q, S.papel==='admin' ? sb.from('prem_clientes').select('*').order('nome') : Promise.resolve({data:[]}),
    sb.from('prem_favorecidos').select('*').eq('ativo',true).order('nome'), sb.from('prem_config').select('*').single(), sb.from('prem_campanhas').select('*, prem_clientes(nome)').order('periodo_inicio',{ascending:false}) ]);
  if(o.error) toast(o.error.message,true);
  S.ordens = o.data||[]; S.clientes = c.data||[]; S.favs = f.data||[]; if(cfg.data){ S.custoTed = Number(cfg.data.custo_ted); S.prazoPos = cfg.data.prazo_pos_campanha_dias; S.durMax = cfg.data.duracao_max_meses; S.avisoRen = cfg.data.aviso_renovacao_dias; } S.camps = cp.data||[];
}
async function recarregar(){ await carregar(); ir(S.tab); }
setInterval(()=>{ if(S.papel && $('#modal').classList.contains('hidden') && !['nova','favorecidos'].includes(S.tab)) recarregar(); }, 60000);

// ================= ADMIN: PAINEL =================
function vPainel(){
  const now=new Date(), ini=new Date(now.getFullYear(),now.getMonth(),1);
  const conc = S.ordens.filter(o=>o.status==='concluida');
  const mes = conc.filter(o=>new Date(o.concluida_em)>=ini);
  const pipe = S.ordens.filter(o=>['enviada','nota_emitida','pago_cliente'].includes(o.status));
  const cnt = s => S.ordens.filter(o=>o.status===s).length;
  const fatMes = mes.reduce((a,o)=>a+Number(o.valor_taxa),0);
  const fatPipe = pipe.reduce((a,o)=>a+Number(o.valor_taxa),0);
  const volMes = mes.reduce((a,o)=>a+Number(o.valor_pagamento),0);
  const acao = S.ordens.filter(o=>['enviada','pago_cliente'].includes(o.status));
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Painel</h1><div class="spacer"></div><button class="btn sm" onclick="recarregar()">Atualizar</button></div>
    <div class="grid kpis">
      <div class="card kpi"><div class="l">Faturamento do mês</div><div class="v">${brl(fatMes)}</div><div class="s">${mes.length} ordens concluídas</div></div>
      <div class="card kpi"><div class="l">Faturamento em andamento</div><div class="v">${brl(fatPipe)}</div><div class="s">${pipe.length} ordens abertas</div></div>
      <div class="card kpi"><div class="l">Volume pago no mês</div><div class="v">${brl(volMes)}</div><div class="s">repassado aos favorecidos</div></div>
      <div class="card kpi"><div class="l">Precisam de você</div><div class="v">${acao.length + S.camps.filter(c=>c.status==='em_analise').length}</div><div class="s">${cnt('enviada')} emitir nota · ${cnt('pago_cliente')} pagar · ${S.camps.filter(c=>c.status==='em_analise').length} campanha(s) p/ aprovar</div></div>

// ================= ADMIN: ORDENS =================
function vOrdens(){
  const f=S.filtro;
  let lista = S.ordens.filter(o=>{
    if(f.status==='acao' && !['enviada','pago_cliente'].includes(o.status)) return false;
    if(f.status && f.status!=='acao' && o.status!==f.status) return false;
    if(f.cliente && o.cliente_id!==f.cliente) return false;
    if(f.q){ const t=(o.descricao+' '+o.favorecido_nome+' '+o.numero+' '+(o.numero_nota||'')+' '+(o.prem_clientes?.nome||'')).toLowerCase(); if(!t.includes(f.q.toLowerCase())) return false; }
    return true; });
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Ordens</h1><div class="spacer"></div><button class="btn pri" onclick="ir('nova')">+ Nova ordem</button></div>
    <div class="card">
      <div class="toolbar">
        <select id="fSt"><option value="acao">Precisam de mim</option><option value="">Todos os status</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')}</select>
        <select id="fCli"><option value="">Todos os clientes</option>${S.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>
        <input id="fQ" placeholder="Buscar descrição, favorecido, nº…" value="${esc(f.q)}">
        <span class="muted small">${lista.length} ordens</span>
      </div>
      ${tabelaOrdens(lista, true)}
    </div>`;
  $('#fSt').value=f.status; $('#fCli').value=f.cliente;
  $('#fSt').onchange=e=>{f.status=e.target.value;vOrdens();};
  $('#fCli').onchange=e=>{f.cliente=e.target.value;vOrdens();};
  $('#fQ').onchange=e=>{f.q=e.target.value;vOrdens();};
  ligarLinhas();
}
function tabelaOrdens(lista, admin){
  if(!lista.length) return `<div class="empty">Nenhuma ordem por aqui.</div>`;
  return `<div class="tblwrap"><table class="tbl"><thead><tr>
    <th>Nº</th><th>Data</th>${admin?'<th>Cliente</th>':''}<th>Descrição / favorecido</th>
    <th class="num">Pagamento</th>${admin?'<th class="num">Taxa</th>':''}<th class="num">Valor da nota</th><th>Status</th></tr></thead><tbody>
    ${lista.map(o=>`<tr class="click" data-id="${o.id}">
      <td>#${o.numero}</td><td>${dt(o.created_at)}</td>${admin?`<td>${esc(o.prem_clientes?.nome)}</td>`:''}
      <td><div>${esc(o.descricao)}</div><div class="muted small">${esc(o.favorecido_nome)}${o.vencimento?' · vence '+dIso(o.vencimento):''}</div></td>
      <td class="num">${brl(o.valor_pagamento)}</td>
      ${admin?`<td class="num">${brl(o.valor_taxa)}<div class="muted small">${pct(o.taxa_percentual)}</div></td>`:''}
      <td class="num"><b>${brl(o.valor_nota)}</b></td><td>${pill(o.status, !admin)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function ligarLinhas(){ document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>detalhe(tr.dataset.id)); }

// ================= DETALHE / AÇÕES =================
async function detalhe(id){
  const o = S.ordens.find(x=>x.id===id); if(!o) return;
  const admin = S.papel==='admin';
  const [{ data:hist }, { data:itens }] = await Promise.all([
    sb.from('prem_historico').select('*').eq('ordem_id',id).order('id'),
    sb.from('prem_ordem_itens').select('*').eq('ordem_id',id).order('created_at') ]);
  const tabItens = (itens&&itens.length) ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Favorecido</th><th>CPF</th><th>Forma / dados</th><th class="num">Valor</th></tr></thead><tbody>
    ${itens.map(i=>`<tr><td><b>${esc(i.nome)}</b></td><td>${esc(fmtDoc(i.cpf))}</td><td class="small">${esc(i.dados_pagamento)}${Number(i.custo_transferencia)?` <span class="muted">(+${brl(i.custo_transferencia)} TED)</span>`:''}</td><td class="num">${brl(i.valor)}</td></tr>`).join('')}
    </tbody></table></div>` : `<p>${esc(o.favorecido_nome||'—')} <span class="muted">${esc(o.dados_pagamento||'')}</span></p>`;
  const arq = [['anexo_ordem','Ordem / boleto'],['anexo_nota','Nota fiscal'],['anexo_comprovante_cliente','Comprovante do cliente'],['anexo_comprovante_pagamento','Comprovante do repasse']]
    .filter(([k])=>o[k]).map(([k,l])=>`<button class="btn sm" data-file="${esc(o[k])}">📎 ${l}</button>`).join('') || '<span class="muted small">Nenhum anexo ainda.</span>';
  const step = ST[o.status].step;
  let acao = '';
  if(admin && o.status==='enviada') acao = `<div class="action"><h2>Emitir nota para o cliente</h2>
      <div class="row"><div class="f"><label>Nº da nota</label><input id="aNum"></div>
      <div class="f"><label>Taxa desta ordem (%)</label><input id="aTaxa" value="${String(o.taxa_percentual).replace('.',',')}"></div></div>
      <div class="calc" id="aCalc"></div>
      <div class="f"><label>Arquivo da nota (PDF)</label><input id="aFile" type="file" accept=".pdf,image/*"></div>
      <button class="btn pri" id="aBtn">Enviar nota ao cliente</button></div>`;
  if(!admin && o.status==='nota_emitida') acao = `<div class="action"><h2>Pague a nota e envie o comprovante</h2>
      <p class="muted" style="margin-top:0">Valor da nota: <b>${brl(o.valor_nota)}</b>. Baixe a nota acima, faça o pagamento e anexe o comprovante.</p>
      <div class="f"><label>Comprovante de pagamento</label><input id="aFile" type="file" accept=".pdf,image/*"></div>
      <button class="btn pri" id="aBtn">Enviar comprovante</button></div>`;
  if(admin && o.status==='nota_emitida') acao = `<div class="action"><p class="muted" style="margin:0 0 10px">Aguardando o cliente pagar a nota. Se ele te mandou o comprovante por fora, você pode anexar aqui.</p>
      <input id="aFile" type="file" accept=".pdf,image/*" style="margin-bottom:10px"><button class="btn" id="aBtn">Anexar comprovante do cliente</button></div>`;
  if(admin && o.status==='pago_cliente') acao = `<div class="action"><h2>Pagar os favorecidos</h2>
      <p class="muted" style="margin-top:0">Faça os pagamentos da lista acima (total <b>${brl(o.valor_pagamento)}</b>) e anexe o(s) comprovante(s) em um único arquivo.</p>
      <div class="f"><label>Comprovante do pagamento</label><input id="aFile" type="file" accept=".pdf,image/*"></div>
      <button class="btn pri" id="aBtn">Concluir ordem</button></div>`;
  const podeCancelar = o.status!=='concluida' && o.status!=='cancelada' && (admin || o.status==='enviada');
  abrirModal(`
    <div class="muted small">Ordem #${o.numero} · ${dth(o.created_at)}</div>
    <h1 style="margin:4px 0 6px">${esc(o.descricao)}</h1>${o.prem_campanhas?`<div class="muted" style="margin-bottom:6px">Campanha: <b>${esc(o.prem_campanhas.nome)}</b></div>`:''}
    <div>${pill(o.status, !admin)}</div>
    ${step?`<div class="steps">${[1,2,3,4].map(i=>`<div class="${i<=step?'on':''}"></div>`).join('')}</div>`:'<div style="height:14px"></div>'}
    <dl class="dl">
      ${admin?`<dt>Cliente</dt><dd>${esc(o.prem_clientes?.nome)}</dd>`:''}
      <dt>Vencimento</dt><dd>${dIso(o.vencimento)}</dd>
      <dt>Total dos pagamentos</dt><dd>${brl(o.valor_pagamento)}</dd>
      <dt>${admin?'Sua taxa':'Taxa de serviço'}</dt><dd>${brl(o.valor_taxa)} <span class="muted">(${pct(o.taxa_percentual)})</span></dd>
      ${Number(o.custo_transferencia)?`<dt>Custo de TED</dt><dd>${brl(o.custo_transferencia)}</dd>`:''}
      <dt>Valor da nota</dt><dd><b>${brl(o.valor_nota)}</b>${o.numero_nota?` <span class="muted">· NF ${esc(o.numero_nota)}</span>`:''}</dd>
      ${o.observacao?`<dt>Observação</dt><dd style="white-space:pre-wrap">${esc(o.observacao)}</dd>`:''}
      ${o.motivo_cancelamento?`<dt>Motivo do cancelamento</dt><dd>${esc(o.motivo_cancelamento)}</dd>`:''}
    </dl>
    <h2>Favorecidos (${(itens||[]).length||1})</h2>${tabItens}<div style="height:16px"></div>
    <h2>Arquivos</h2><div class="files">${arq}</div>
    ${acao}
    <h2 style="margin-top:20px">Histórico</h2>
    <ul class="tl">${(hist||[]).map(h=>`<li><span>${esc(ST[h.status].l)}${h.observacao?' — '+esc(h.observacao):''}</span><span class="muted">${dth(h.created_at)}</span></li>`).join('')}</ul>
    ${podeCancelar?`<div style="margin-top:18px;display:flex;gap:8px;align-items:center"><input id="cMot" placeholder="Motivo do cancelamento" style="max-width:320px"><button class="btn danger sm" id="cBtn">Cancelar ordem</button></div>`:''}
  `);
  document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.file));
  const btn=$('#aBtn');
  if(admin && o.status==='enviada'){
    const upd=()=>{ const t=parseValor($('#aTaxa').value), tx=Math.round(o.valor_pagamento*t)/100;
      const ted=Number(o.custo_transferencia||0);
      $('#aCalc').innerHTML=`<div>Pagamentos<b>${brl(o.valor_pagamento)}</b></div><div>Sua taxa<b>${brl(tx)}</b></div>${ted?`<div>Custo TED<b>${brl(ted)}</b></div>`:''}<div>Valor da nota<b>${brl(Number(o.valor_pagamento)+tx+ted)}</b></div>`; };
    $('#aTaxa').oninput=upd; upd();
    btn.onclick=()=>busy(btn,async()=>{
      const f=$('#aFile').files[0]; if(!f) throw new Error('Anexe o arquivo da nota.');
      const path=await upload(o.cliente_id,o.id,'nota',f);
      const {error}=await sb.rpc('prem_emitir_nota',{p_ordem:o.id,p_numero_nota:$('#aNum').value.trim()||null,p_anexo:path,p_taxa:parseValor($('#aTaxa').value)});
      if(error) throw error; toast('Nota enviada ao cliente.'); fecharModal(); recarregar(); });
  }
  if(o.status==='nota_emitida' && btn){
    btn.onclick=()=>busy(btn,async()=>{
      const f=$('#aFile').files[0]; if(!f) throw new Error('Anexe o comprovante.');
      const path=await upload(o.cliente_id,o.id,'comprovante',f);
      const {error}=await sb.rpc('prem_cliente_enviar_comprovante',{p_ordem:o.id,p_anexo:path});
      if(error) throw error; toast('Comprovante enviado.'); fecharModal(); recarregar(); });
  }
  if(admin && o.status==='pago_cliente'){
    btn.onclick=()=>busy(btn,async()=>{
      const f=$('#aFile').files[0]; if(!f) throw new Error('Anexe o comprovante do pagamento.');
      const path=await upload(o.cliente_id,o.id,'pagamento',f);
      const {error}=await sb.rpc('prem_concluir',{p_ordem:o.id,p_anexo:path});
      if(error) throw error; toast('Ordem concluída. Faturamento registrado.'); fecharModal(); recarregar(); });
  }
  if(podeCancelar) $('#cBtn').onclick=()=>busy($('#cBtn'),async()=>{
    const m=$('#cMot').value.trim(); if(!m) throw new Error('Informe o motivo do cancelamento.');
    const {error}=await sb.rpc('prem_cancelar',{p_ordem:o.id,p_motivo:m}); if(error) throw error;
    toast('Ordem cancelada.'); fecharModal(); recarregar(); });
}

// ================= NOVA ORDEM (cliente ou admin) =================
let NOVA = { itens:[] };
function vNova(){
  const admin=S.papel==='admin';
  if(!NOVA.itens.length) NOVA.itens=[{fav:'',valor:''}];
  $('#main').innerHTML = `<div class="card" style="max-width:860px">
    <h1>Nova ordem de pagamento</h1>
    <form id="nForm">
      ${admin?`<div class="f"><label>Cliente</label><select id="nCli" required><option value="">Selecione…</option>${S.clientes.filter(c=>c.ativo).map(c=>`<option value="${c.id}">${esc(c.nome)} (${pct(c.taxa_percentual)})</option>`).join('')}</select></div>`:''}
      <div class="f"><label>Campanha</label><div id="nCampBox"></div></div>
      <div class="row">
        <div class="f"><label>Descrição</label><input id="nDesc" required placeholder="Ex.: Premiação equipe de vendas – novembro"></div>
        <div class="f"><label>Data para pagamento</label><input id="nVenc" type="date"></div>
      </div>
      <div class="toolbar" style="margin:6px 0 8px"><h2 style="margin:0">Favorecidos</h2><div class="spacer"></div>
        <button type="button" class="btn sm" id="nNovoFav">+ Cadastrar favorecido</button></div>
      <div id="nItens"></div>
      <button type="button" class="btn sm" id="nAdd" style="margin:4px 0 16px">+ Adicionar favorecido à ordem</button>
      <div class="calc" id="nCalc"></div>
      <div class="f"><label>Anexo (planilha, documento) – opcional</label><input id="nFile" type="file"></div>
      <div class="f"><label>Observação</label><textarea id="nObs"></textarea></div>
      <button class="btn pri" id="nBtn">Enviar ordem</button>
    </form></div>`;
  if(admin){ $('#nCli').value = S.favCli||''; $('#nCli').onchange=()=>{ S.favCli=$('#nCli').value; NOVA.itens=[{fav:'',valor:''}]; desenharItens(); desenharCamp(); }; }
  desenharCamp();
  $('#nAdd').onclick=()=>{ NOVA.itens.push({fav:'',valor:''}); desenharItens(); };
  $('#nNovoFav').onclick=()=>{ const c=cliNova(); if(admin&&!c) return toast('Selecione o cliente primeiro.',true);
    formFav(null, c, fav=>{ const vazio=NOVA.itens.find(i=>!i.fav); if(vazio) vazio.fav=fav.id; else NOVA.itens.push({fav:fav.id,valor:''}); desenharItens(); }); };
  desenharItens();
  $('#nForm').onsubmit=e=>{ e.preventDefault(); busy($('#nBtn'),async()=>{
    const cliente_id=cliNova(); if(!cliente_id) throw new Error('Selecione o cliente.');
    const itens=NOVA.itens.filter(i=>i.fav||parseValor(i.valor));
    if(!itens.length) throw new Error('Adicione ao menos um favorecido.');
    for(const i of itens){ if(!i.fav) throw new Error('Escolha o favorecido em todas as linhas.'); if(parseValor(i.valor)<=0) throw new Error('Informe o valor de todos os favorecidos.'); }
    const id=crypto.randomUUID();
    const anexo=await upload(cliente_id,id,'ordem',$('#nFile').files[0]);
    const campanha=$('#nCamp')?.value; if(!campanha) throw new Error('Escolha a campanha desta ordem. Sem campanha aprovada não é possível enviar ordens.');
    const {error}=await sb.rpc('prem_criar_ordem',{ p_id:id, p_cliente:cliente_id, p_campanha:campanha, p_descricao:$('#nDesc').value.trim(),
      p_vencimento:$('#nVenc').value||null, p_observacao:$('#nObs').value.trim()||null, p_anexo:anexo,
      p_itens:itens.map(i=>({favorecido_id:i.fav, valor:parseValor(i.valor)})) });
    if(error) throw error;
    NOVA.itens=[]; toast('Ordem enviada!'); await carregar(); ir(S.papel==='admin'?'ordens':'minhas');
  });};
}
function cliNova(){ return S.papel==='admin' ? ($('#nCli')?.value||'') : S.clienteId; }
function favsDe(cli){ return S.favs.filter(f=>f.cliente_id===cli); }
function desenharItens(){
  const cli=cliNova(), lista=favsDe(cli);
  $('#nItens').innerHTML = !cli ? `<p class="muted">Selecione o cliente para ver os favorecidos.</p>` :
    !lista.length ? `<p class="muted">Nenhum favorecido cadastrado ainda. Clique em <b>+ Cadastrar favorecido</b>.</p>` :
    NOVA.itens.map((it,ix)=>{ const f=lista.find(x=>x.id===it.fav);
      return `<div class="row" style="grid-template-columns:2fr 1fr auto;align-items:end;margin-bottom:8px">
        <div><select data-fav="${ix}"><option value="">Escolha o favorecido…</option>${lista.map(x=>`<option value="${x.id}" ${x.id===it.fav?'selected':''}>${esc(x.nome)} · ${esc(fmtDoc(x.cpf))} · ${x.forma_pagamento==='pix'?'PIX':'TED'}</option>`).join('')}</select>
          ${f?`<div class="muted small" style="margin-top:4px">${esc(favDados(f))}${f.forma_pagamento==='ted'?` · <b>+${brl(S.custoTed)} de TED</b>`:''}</div>`:''}</div>
        <div><input data-val="${ix}" inputmode="decimal" placeholder="Valor R$" value="${esc(it.valor)}"></div>
        <button type="button" class="btn sm danger" data-rm="${ix}" title="Remover">✕</button></div>`; }).join('');
  document.querySelectorAll('[data-fav]').forEach(s=>s.onchange=()=>{ NOVA.itens[s.dataset.fav].fav=s.value; desenharItens(); });
  document.querySelectorAll('[data-val]').forEach(s=>s.oninput=()=>{ NOVA.itens[s.dataset.val].valor=s.value; calcNova(); });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ NOVA.itens.splice(b.dataset.rm,1); if(!NOVA.itens.length) NOVA.itens.push({fav:'',valor:''}); desenharItens(); });
  calcNova();
}
function calcNova(){
  const cli=cliNova(), t = S.papel==='admin' ? Number(S.clientes.find(c=>c.id===cli)?.taxa_percentual||0) : Number(S.cliente?.taxa_percentual||0);
  let v=0, teds=0; NOVA.itens.forEach(i=>{ const val=parseValor(i.valor); v+=val; const f=S.favs.find(x=>x.id===i.fav); if(f&&f.forma_pagamento==='ted') teds++; });
  const tx=Math.round(v*t)/100, ct=teds*S.custoTed;
  $('#nCalc').innerHTML=`<div>Total a pagar<b>${brl(v)}</b></div><div>Taxa de serviço (${pct(t)})<b>${brl(tx)}</b></div>`+
    `<div>Custo TED (${teds} × ${brl(S.custoTed)})<b>${brl(ct)}</b></div><div>Valor da nota<b>${brl(v+tx+ct)}</b></div>`;
}

// ================= FAVORECIDOS =================

  const nomeCli = id => S.clientes.find(c=>c.id===id)?.nome||'';
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Favorecidos</h1><div class="spacer"></div>

      ${lista.map(f=>`<tr><td><b>${esc(f.nome)}</b></td>${admin&&!cli?`<td>${esc(nomeCli(f.cliente_id))}</td>`:''}<td>${esc(fmtDoc(f.cpf))}</td>
        <td>${f.forma_pagamento==='pix'?'<span class="pill st-concluida">PIX</span>':'<span class="pill st-enviada">TED +'+brl(S.custoTed)+'</span>'}</td>
        <td class="small">${esc(favDados(f).replace(/^(PIX|TED) · /,''))}</td>
        <td class="num"><button class="btn sm" data-ed="${f.id}">Editar</button> <button class="btn sm danger" data-del="${f.id}">Remover</button></td></tr>`).join('')}

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const f=S.favs.find(x=>x.id===b.dataset.del);
    abrirModal(`<h2>Remover ${esc(f.nome)}?</h2><p class="muted">Ele deixa de aparecer para novas ordens. Ordens antigas não mudam.</p>
      <button class="btn danger" id="rmOk">Remover</button> <button class="btn" onclick="fecharModal()">Voltar</button>`);
    $('#rmOk').onclick=()=>busy($('#rmOk'),async()=>{ const {error}=await sb.from('prem_favorecidos').update({ativo:false}).eq('id',f.id); if(error) throw error;
      fecharModal(); await carregar(); vFavorecidos(); }); });
}
function formFav(id, clienteId, onSaved){
  const f = S.favs.find(x=>x.id===id) || {forma_pagamento:'pix', pix_tipo:'cpf'};
  abrirModal(`<h1>${id?'Editar favorecido':'Novo favorecido'}</h1>
    <form id="fvForm">
      <div class="row"><div class="f"><label>Nome completo</label><input id="fvNome" required value="${esc(f.nome||'')}"></div>
      <div class="f"><label>CPF</label><input id="fvCpf" required inputmode="numeric" placeholder="000.000.000-00" value="${esc(fmtDoc(f.cpf||''))}"></div></div>
      <div class="f"><label>Forma de pagamento</label>
        <select id="fvForma"><option value="pix">PIX (preferencial, sem custo)</option><option value="ted">TED (custo de ${brl(S.custoTed)})</option></select></div>
      <div id="fvPix" class="row"><div class="f"><label>Tipo de chave</label><select id="fvPixTipo">${Object.entries(PIX_TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="f"><label>Chave PIX</label><input id="fvPixChave" value="${esc(f.pix_chave||'')}"></div></div>
      <div id="fvTed"><div class="row"><div class="f"><label>Banco (nome ou código)</label><input id="fvBanco" value="${esc(f.banco||'')}"></div>
        <div class="f"><label>Tipo de conta</label><select id="fvTipoConta"><option value="corrente">Corrente</option><option value="poupanca">Poupança</option></select></div></div>
        <div class="row"><div class="f"><label>Agência</label><input id="fvAg" value="${esc(f.agencia||'')}"></div>
        <div class="f"><label>Conta com dígito</label><input id="fvConta" value="${esc(f.conta||'')}"></div></div></div>
      <div id="fvMsg"></div>
      <button class="btn pri" id="fvBtn">Salvar</button>
    </form>`);
  $('#fvForma').value=f.forma_pagamento; $('#fvPixTipo').value=f.pix_tipo||'cpf'; $('#fvTipoConta').value=f.tipo_conta||'corrente';
  const alterna=()=>{ const pix=$('#fvForma').value==='pix'; $('#fvPix').classList.toggle('hidden',!pix); $('#fvTed').classList.toggle('hidden',pix); };
  $('#fvForma').onchange=alterna; alterna();
  $('#fvPixTipo').onchange=()=>{ if($('#fvPixTipo').value==='cpf' && !$('#fvPixChave').value) $('#fvPixChave').value=soDig($('#fvCpf').value); };
  $('#fvForm').onsubmit=e=>{ e.preventDefault(); busy($('#fvBtn'),async()=>{
    const cpf=soDig($('#fvCpf').value);
    if(!(cpfValido(cpf)||cnpjValido(cpf))) throw new Error('CPF inválido. Confira os números.');
    const forma=$('#fvForma').value;
    const row={ nome:$('#fvNome').value.trim(), cpf, forma_pagamento:forma };
    if(forma==='pix'){ row.pix_tipo=$('#fvPixTipo').value; row.pix_chave=$('#fvPixChave').value.trim() || (row.pix_tipo==='cpf'?cpf:'');
      if(!row.pix_chave) throw new Error('Informe a chave PIX.'); }
    else { row.banco=$('#fvBanco').value.trim(); row.agencia=$('#fvAg').value.trim(); row.conta=$('#fvConta').value.trim(); row.tipo_conta=$('#fvTipoConta').value;
      if(!row.banco||!row.agencia||!row.conta) throw new Error('Preencha banco, agência e conta.'); }
    let res;
    if(id) res = await sb.from('prem_favorecidos').update(row).eq('id',id).select().single();
    else { row.cliente_id=clienteId; res = await sb.from('prem_favorecidos').insert(row).select().single(); }
    if(res.error) throw new Error(res.error.code==='23505'?'Já existe um favorecido com esse CPF.':res.error.message);
    fecharModal(); toast('Favorecido salvo.'); await carregar(); onSaved && onSaved(res.data);
  });};
}

// ================= CAMPANHAS =================
const CST = { em_analise:['Em análise','st-enviada'], ajustes:['Ajustes solicitados','st-cancelada'], aprovada:['Aprovada','st-concluida'], reprovada:['Reprovada','st-cancelada'] };
const hoje = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const dataDe = s => new Date(s+'T00:00:00');
const diasAte = s => Math.round((dataDe(s)-hoje())/86400000);
function campsValidas(cli){ const pz=Number(S.prazoPos??30);
  return S.camps.filter(c=>c.cliente_id===cli && c.status==='aprovada' && diasAte(c.periodo_inicio)<=0 && diasAte(c.periodo_fim)>=-pz); }
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function fimMax(ini){ const d=dataDe(ini); d.setMonth(d.getMonth()+(S.durMax||3)); d.setDate(d.getDate()-1); return isoD(d); }
function podeRenovar(c){ if(c.status!=='aprovada' || S.camps.some(x=>x.renovada_de===c.id)) return false;
  const d=diasAte(c.periodo_fim); return d<=(S.avisoRen??15) && d>=-(S.prazoPos??30); }
function periodoRenov(c){ const d=dataDe(c.periodo_fim); d.setDate(d.getDate()+1); const ini=isoD(d); return [ini, fimMax(ini)]; }
function renovarCampanha(id){
  const c=S.camps.find(x=>x.id===id); const [ini,fim]=periodoRenov(c);
  abrirModal(`<h1>Repetir a campanha "${esc(c.nome)}"?</h1>
    <p>Vamos criar a mesma campanha, com o mesmo briefing e regulamento, para o próximo período:</p>
    <div class="calc"><div>Novo período<b>${dIso(ini)} a ${dIso(fim)}</b></div><div>Duração<b>${S.durMax||3} meses</b></div></div>
    <p class="muted small">A repetição já nasce aprovada. Se quiser mudar participantes, metas ou critérios, cadastre uma campanha nova em vez de repetir.</p>
    <button class="btn pri" id="rnOk">Sim, repetir por mais ${S.durMax||3} meses</button> <button class="btn" onclick="fecharModal()">Agora não</button>`);
  $('#rnOk').onclick=()=>busy($('#rnOk'),async()=>{ const {error}=await sb.rpc('prem_renovar_campanha',{p_campanha:id}); if(error) throw error;
    fecharModal(); toast('Campanha repetida até '+dIso(fim)+'.'); await carregar(); ir(S.tab); });
}
function campSituacao(c){
  if(c.status!=='aprovada') return `<span class="pill ${CST[c.status][1]}">${CST[c.status][0]}</span>`;
  const pz=Number(S.prazoPos??30);
  if(diasAte(c.periodo_inicio)>0) return `<span class="pill st-nota_emitida">Aprovada · começa ${dIso(c.periodo_inicio)}</span>`;
  if(diasAte(c.periodo_fim)>=0) return `<span class="pill st-concluida">Em andamento</span>`;
  if(diasAte(c.periodo_fim)>=-pz) return `<span class="pill st-pago_cliente">Encerrada · ordens até ${new Date(dataDe(c.periodo_fim).getTime()+pz*86400000).toLocaleDateString('pt-BR')}</span>`;
  return `<span class="pill st-cancelada">Encerrada</span>`;
}
function regulamento(emp){
  emp = emp || 'A empresa';
  return [`Ao participar, o colaborador declara conhecer e concordar com todas as regras desta campanha.`,
    `${emp} poderá ajustar objetivos e critérios quando necessário, comunicando antes todos os participantes.`,
    `Os prêmios têm natureza de incentivo e reconhecimento por desempenho superior ao ordinariamente esperado, não integram a remuneração e não se incorporam ao salário, nos termos do art. 457, §§ 2º e 4º, da CLT (redação da Lei nº 13.467/2017).`,
    `Situações não previstas neste briefing serão decididas pela diretoria de ${emp}.`];
}
function desenharCamp(){
  const box=$('#nCampBox'); if(!box) return;
  const admin=S.papel==='admin', cli=cliNova(), lista=cli?campsValidas(cli):[];
  if(!cli){ box.innerHTML='<p class="muted" style="margin:0">Selecione o cliente.</p>'; return; }
  if(!lista.length){
    box.innerHTML = `<div class="msg err" style="margin:0">Não há campanha aprovada e vigente${admin?' para este cliente':''}. Sem campanha não é possível enviar ordens.
      ${admin?'':' <button type="button" class="link" onclick="formCampanha()">Preencher briefing da campanha</button>'}</div>`;
    $('#nBtn') && ($('#nBtn').disabled=true); return; }
  $('#nBtn') && ($('#nBtn').disabled=false);
  box.innerHTML = `<select id="nCamp" required>${lista.length>1?'<option value="">Escolha a campanha…</option>':''}${lista.map(c=>`<option value="${c.id}">${esc(c.nome)} · ${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</option>`).join('')}</select>`;
}
function vCampanhas(){
  const admin=S.papel==='admin';
  const f = S.campFiltro===undefined ? (admin && S.camps.some(c=>c.status==='em_analise') ? 'em_analise' : '') : S.campFiltro;
  const lista=S.camps.filter(c=>!f||c.status===f);
  const pagoPor = id => S.ordens.filter(o=>o.campanha_id===id && o.status!=='cancelada').reduce((a,o)=>a+Number(o.valor_pagamento),0);
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Campanhas</h1><div class="spacer"></div>
      <select id="cpF" style="width:auto"><option value="">Todas</option>${Object.entries(CST).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
      <button class="btn pri" onclick="formCampanha()">+ Nova campanha</button></div>
    <p class="muted" style="margin-top:-6px">Toda ordem de pagamento precisa estar ligada a uma campanha aprovada. Duração máxima: ${S.durMax||3} meses; ordens aceitas até ${S.prazoPos??30} dias após o fim.</p>
    <div class="card">${lista.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Nº</th>${admin?'<th>Cliente</th>':''}<th>Campanha</th><th>Período</th><th class="num">Orçamento</th><th class="num">Pago</th><th>Situação</th></tr></thead><tbody>
      ${lista.map(c=>`<tr class="click" data-camp="${c.id}"><td>#${c.numero}</td>${admin?`<td>${esc(c.prem_clientes?.nome)}</td>`:''}<td><b>${esc(c.nome)}</b>${c.renovada_de?` <span class="muted small">· repetição de #${S.camps.find(x=>x.id===c.renovada_de)?.numero??''}</span>`:''}${podeRenovar(c)?' <span class="pill st-enviada">Terminando</span>':''}<div class="muted small">${esc(c.participantes).slice(0,80)}</div></td>
        <td>${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</td><td class="num">${c.orcamento_previsto?brl(c.orcamento_previsto):'—'}</td><td class="num">${brl(pagoPor(c.id))}</td><td>${campSituacao(c)}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty">${f?'Nenhuma campanha com esse status.':'Nenhuma campanha cadastrada ainda.'}</div>`}</div>`;
  $('#cpF').value=f; $('#cpF').onchange=e=>{ S.campFiltro=e.target.value; vCampanhas(); };
  document.querySelectorAll('[data-camp]').forEach(tr=>tr.onclick=()=>detalheCampanha(tr.dataset.camp));
}
function detalheCampanha(id){
  const c=S.camps.find(x=>x.id===id); if(!c) return;
  const admin=S.papel==='admin';
  const ords=S.ordens.filter(o=>o.campanha_id===id && o.status!=='cancelada');
  const pago=ords.reduce((a,o)=>a+Number(o.valor_pagamento),0);
  const emp = admin ? c.prem_clientes?.nome : S.cliente?.nome;
  const bloco=(t,v)=>v?`<h2 style="margin:16px 0 6px">${t}</h2><div style="white-space:pre-wrap">${esc(v)}</div>`:'';
  abrirModal(`
    <div class="muted small">Campanha #${c.numero}${admin?' · '+esc(emp):''}</div>
    <h1 style="margin:4px 0 6px">${esc(c.nome)}</h1>
    <div>${campSituacao(c)}</div>
    ${c.parecer&&c.status!=='aprovada'?`<div class="msg err" style="margin-top:12px">${esc(c.parecer)}</div>`:''}
    <dl class="dl" style="margin-top:16px">
      <dt>Período</dt><dd>${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</dd>
      <dt>Orçamento previsto</dt><dd>${c.orcamento_previsto?brl(c.orcamento_previsto):'—'}</dd>
      <dt>Já pago em ordens</dt><dd>${brl(pago)} <span class="muted">(${ords.length} ordens)</span></dd>
      ${c.aprovada_em?`<dt>Aprovada em</dt><dd>${dth(c.aprovada_em)}</dd>`:''}
    </dl>
    ${bloco('1. Participantes',c.participantes)}${bloco('2. Objetivos',c.objetivos)}${bloco('3. Critérios de avaliação',c.criterios_avaliacao)}
    ${bloco('4. Critérios de premiação',c.criterios_premiacao)}${bloco('5. Formas de bonificação',c.formas_bonificacao)}${bloco('Considerações adicionais',c.consideracoes)}
    <h2 style="margin:16px 0 6px">Regulamento</h2><ul class="small" style="margin:0;padding-left:18px">${regulamento(emp).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <p class="small muted">Aceito em ${dth(c.aceite_em)}.</p>
    ${c.logo?`<button class="btn sm" data-file="${esc(c.logo)}">📎 Logo da empresa</button>`:''}
    ${admin && c.status!=='aprovada' ? `<div class="action" style="margin-top:16px"><h2>Análise</h2>
      <div class="f"><label>Parecer / ajustes necessários</label><textarea id="cpPar">${esc(c.parecer||'')}</textarea></div>
      <button class="btn pri" data-st="aprovada">Aprovar campanha</button> <button class="btn" data-st="ajustes">Pedir ajustes</button> <button class="btn danger" data-st="reprovada">Reprovar</button></div>`:''}
    ${admin && c.status==='aprovada' ? `<div style="margin-top:16px"><button class="btn sm" data-st="ajustes">Reabrir para ajustes</button></div>`:''}
    ${podeRenovar(c) ? `<div class="action" style="margin-top:16px"><b>Esta campanha termina em ${dIso(c.periodo_fim)}.</b> Quer repetir por mais ${S.durMax||3} meses (${dIso(periodoRenov(c)[0])} a ${dIso(periodoRenov(c)[1])})?<div style="margin-top:10px"><button class="btn pri" id="cpRen">Repetir campanha</button></div></div>`:''}
    ${!admin && ['em_analise','ajustes'].includes(c.status) ? `<div style="margin-top:16px"><button class="btn" id="cpEd">Editar briefing</button></div>`:''}
    ${admin ? `<div style="margin-top:8px"><button class="btn sm" id="cpEd">Editar briefing</button></div>`:''}`);
  document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.file));
  $('#cpEd') && ($('#cpEd').onclick=()=>formCampanha(id));
  $('#cpRen') && ($('#cpRen').onclick=()=>renovarCampanha(id));
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>busy(b,async()=>{
    const st=b.dataset.st, par=($('#cpPar')?.value||'').trim();
    if(st!=='aprovada' && !par && $('#cpPar')) throw new Error('Escreva no parecer o que precisa ser ajustado.');
    const {error}=await sb.from('prem_campanhas').update({status:st, parecer:par||c.parecer||null}).eq('id',id);
    if(error) throw error; toast(st==='aprovada'?'Campanha aprovada. O cliente já pode enviar ordens.':'Campanha atualizada.'); fecharModal(); await carregar(); ir(S.tab);
  }));
}
function formCampanha(id){
  const admin=S.papel==='admin';
  const c=S.camps.find(x=>x.id===id) || {};
  const t=(k,l,dica,req=true)=>`<div class="f"><label>${l}</label><textarea id="cp_${k}" ${req?'required':''} placeholder="${esc(dica)}">${esc(c[k]||'')}</textarea></div>`;
  const emp = admin ? (S.clientes.find(x=>x.id===(c.cliente_id||S.favCli))?.nome) : S.cliente?.nome;
  abrirModal(`<h1>${id?'Editar campanha':'Briefing da campanha'}</h1>
    <p class="muted" style="margin-top:0">Descreva a campanha de incentivo. Ela será analisada e, depois de aprovada, você poderá enviar as ordens de premiação vinculadas a ela.</p>
    <form id="cpForm">
      ${admin&&!id?`<div class="f"><label>Cliente</label><select id="cpCli" required><option value="">Selecione…</option>${S.clientes.filter(x=>x.ativo).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>`:''}
      <div class="f"><label>Nome da campanha</label><input id="cp_nome" required value="${esc(c.nome||'')}" placeholder="Ex.: Campanha de Vendas 1º Trimestre"></div>
      <div class="row"><div class="f"><label>Início</label><input id="cp_ini" type="date" required value="${c.periodo_inicio||''}"></div>
        <div class="f"><label>Fim <span class="muted" id="cpFimHint">(escolha o início primeiro)</span></label><input id="cp_fim" type="date" required value="${c.periodo_fim||''}"></div></div>
      ${t('participantes','1. Participantes','Quem participa: equipes, cargos, lojas, quantidade aproximada de pessoas.')}
      ${t('objetivos','2. Objetivos da campanha','O que a empresa quer alcançar: metas de venda, produtos foco, indicadores a melhorar.')}
      ${t('criterios_avaliacao','3. Critérios de avaliação','Como o desempenho será medido: indicadores, de onde vêm os dados, com que frequência.')}
      ${t('criterios_premiacao','4. Critérios de premiação','Quem recebe e quanto: faixas de atingimento, ranking, valor por meta batida.')}
      ${t('formas_bonificacao','5. Formas de bonificação','Como o prêmio será pago: PIX, valor fixo ou variável, quando será pago.')}
      <div class="row"><div class="f"><label>Orçamento previsto (R$) – opcional</label><input id="cp_orc" inputmode="decimal" value="${c.orcamento_previsto?String(c.orcamento_previsto).replace('.',','):''}"></div>
        <div class="f"><label>Logo da empresa (PNG fundo branco/transparente) – opcional</label><input id="cp_logo" type="file" accept="image/png,image/*"></div></div>
      ${t('consideracoes','Considerações adicionais – opcional','Regras extras, exceções, observações.',false)}
      <div class="card" style="background:#fafbfc;padding:14px;margin-bottom:12px"><b>Regulamento</b>
        <ul class="small" id="cpReg" style="margin:8px 0 0;padding-left:18px">${regulamento(emp).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="f"><label style="font-weight:500"><input type="checkbox" id="cp_ok" style="width:auto" required> Li e concordo com o regulamento acima${emp?' em nome de '+esc(emp):''}.</label></div>
      <button class="btn pri" id="cpBtn">${id?'Salvar e enviar para análise':'Enviar para análise'}</button>
    </form>`);
  if(admin&&!id){ $('#cpCli').value=S.favCli||''; }
  const ajustaFim=()=>{ const ini=$('#cp_ini').value, f=$('#cp_fim');
    if(!ini){ f.disabled=true; f.removeAttribute('min'); f.removeAttribute('max'); return; }
    const mx=fimMax(ini); f.disabled=false; f.min=ini; f.max=mx;
    if(!f.value || f.value>mx || f.value<ini) f.value=mx;
    $('#cpFimHint').textContent=`Até ${dIso(mx)} (máx. ${S.durMax||3} meses)`; };
  $('#cp_ini').addEventListener('change',ajustaFim); ajustaFim();
  $('#cpForm').onsubmit=e=>{e.preventDefault(); busy($('#cpBtn'),async()=>{
    const ini=$('#cp_ini').value, fim=$('#cp_fim').value;
    if(fim<ini) throw new Error('A data de fim deve ser depois do início.');
    const lim=new Date(dataDe(ini)); lim.setMonth(lim.getMonth()+(S.durMax||3)); lim.setDate(lim.getDate()-1);
    if(dataDe(fim)>lim) throw new Error(`A campanha pode durar no máximo ${S.durMax||3} meses (até ${lim.toLocaleDateString('pt-BR')}).`);
    const cli = admin ? (c.cliente_id || $('#cpCli').value) : S.clienteId; if(!cli) throw new Error('Selecione o cliente.');
    const cid = id || crypto.randomUUID();
    const row={ nome:$('#cp_nome').value.trim(), periodo_inicio:ini, periodo_fim:fim, aceite_regulamento:true,
      participantes:$('#cp_participantes').value.trim(), objetivos:$('#cp_objetivos').value.trim(), criterios_avaliacao:$('#cp_criterios_avaliacao').value.trim(),
      criterios_premiacao:$('#cp_criterios_premiacao').value.trim(), formas_bonificacao:$('#cp_formas_bonificacao').value.trim(),
      consideracoes:$('#cp_consideracoes').value.trim()||null, orcamento_previsto:parseValor($('#cp_orc').value)||null };
    const lf=$('#cp_logo').files[0]; if(lf) row.logo=await upload(cli,'campanhas/'+cid,'logo',lf);
    const res = id ? await sb.from('prem_campanhas').update(row).eq('id',id) : await sb.from('prem_campanhas').insert({...row, id:cid, cliente_id:cli});
    if(res.error) throw res.error;
    fecharModal(); toast(admin?'Campanha salva.':'Campanha enviada para análise.'); await carregar(); ir(admin?'campanhas':(S.tab==='nova'?'nova':'campanhas'));
  });};
}

// ================= EQUIPE (administradores) =================
async function vEquipe(){
  $('#main').innerHTML='<div class="card empty">Carregando…</div>';
  const {data, error}=await sb.rpc('prem_equipe'); if(error) return toast(error.message,true);
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Equipe</h1><div class="spacer"></div><button class="btn pri" id="eqNovo">+ Adicionar pessoa</button></div>

    <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Nome</th><th>E-mail</th><th>Acesso</th><th>Último acesso</th><th></th></tr></thead><tbody>
      ${(data||[]).map(u=>`<tr><td><b>${esc(u.nome||'—')}</b></td><td>${esc(u.email)}</td>
        <td>${u.tem_login?'<span class="pill st-concluida">Ativo</span>':'<span class="pill st-enviada">Aguardando primeiro acesso</span>'}</td>
        <td>${u.ultimo_acesso?dth(u.ultimo_acesso):'—'}</td>
        <td class="num">${u.email.toLowerCase()===S.user.email.toLowerCase()?'<span class="muted small">você</span>':`<button class="btn sm danger" data-rm="${esc(u.email)}">Remover</button>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#eqNovo').onclick=()=>{
    abrirModal(`<h1>Adicionar pessoa à equipe</h1>
      <form id="eqForm"><div class="f"><label>Nome</label><input id="eqNome" required></div>
      <div class="f"><label>E-mail</label><input id="eqEmail" type="email" required></div>

      <button class="btn pri" id="eqBtn">Salvar</button></form>`);

      const {error}=await sb.from('prem_admin_emails').insert({email, nome:$('#eqNome').value.trim()});

  });

function mdHtml(t){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out='', inList=false;
  for(const raw of String(t||'').split('\n')){
    const l=raw.trimEnd();
    const li=l.match(/^\d+\.\s+(.*)$/);
    if(li){ if(!inList){ out+='<ol>'; inList=true; } out+=`<li>${inl(li[1])}</li>`; continue; }
    if(inList){ out+='</ol>'; inList=false; }
    if(!l) continue;
    if(l.startsWith('## ')) out+=`<h3>${inl(l.slice(3))}</h3>`;
    else if(l.startsWith('# ')) out+=`<h2 style="text-align:center">${inl(l.slice(2))}</h2>`;
    else out+=`<p>${inl(l)}</p>`;
  }
  if(inList) out+='</ol>';
  return out;
}

async function verContratoAssinado(clienteId){
  const {data,error}=await sb.from('prem_contrato_aceites').select('*').eq('cliente_id',clienteId).order('aceito_em',{ascending:false}).limit(1);
  if(error) return toast(error.message,true);

  abrirModal(`<h1 style="margin-bottom:4px">Contrato assinado</h1>
    <p class="muted small" style="margin-top:0">Versão ${a.versao} · assinado em ${dth(a.aceito_em)} por ${esc(a.rep_nome)} (CPF ${esc(fmtDoc(a.rep_cpf))}) · login ${esc(a.email)}<br>Hash SHA-256: <code style="word-break:break-all">${esc(a.hash_sha256)}</code></p>

    <button class="btn" style="margin-top:12px" id="ctCopy">Copiar texto</button>`);

function vMinhas(){
  const pend=S.ordens.filter(o=>o.status==='nota_emitida');

  const acabando=S.camps.filter(podeRenovar);
  const avisoCamp = !validas.length ? `<div class="card" style="margin-bottom:16px;border-color:var(--warn)"><h2>${analise.length?'Sua campanha está em análise':'Cadastre sua campanha para enviar ordens'}</h2>
      <p class="muted" style="margin:0 0 10px">${analise.length?'Assim que for aprovada você já pode enviar as ordens de pagamento.':'As premiações precisam estar ligadas a uma campanha de incentivo aprovada. Preencha o briefing da campanha.'}</p>
      ${analise.length?'':`<button class="btn pri" onclick="formCampanha()">Preencher briefing da campanha</button>`}</div>`
    : '';
  const avisoRen = acabando.map(c=>{ const d=diasAte(c.periodo_fim), [ri,rf]=periodoRenov(c);
      return `<div class="card" style="margin-bottom:16px;border-color:var(--warn)"><h2>A campanha "${esc(c.nome)}" ${d>0?`termina em ${d} dia(s) (${dIso(c.periodo_fim)})`:d===0?'termina hoje':`terminou em ${dIso(c.periodo_fim)}`}</h2>
      <p class="muted" style="margin:0 0 10px">Quer repetir a mesma campanha por mais ${S.durMax||3} meses, de ${dIso(ri)} a ${dIso(rf)}? O sistema cria e aprova automaticamente.</p>
      <button class="btn pri" onclick="renovarCampanha('${c.id}')">Sim, repetir campanha</button> <button class="btn" onclick="formCampanha()">Não, cadastrar uma nova</button></div>`; }).join('');
  const avisoAj = ajustes.length?`<div class="card" style="margin-bottom:16px;border-color:var(--bad)"><h2>Campanha com ajustes solicitados</h2><p class="muted" style="margin:0 0 10px">${esc(ajustes[0].parecer||'')}</p><button class="btn" onclick="formCampanha('${ajustes[0].id}')">Ajustar campanha</button></div>`:'';
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Olá, ${esc(S.cliente?.nome||'')}</h1><div class="spacer"></div>
      <button class="btn sm" onclick="recarregar()">Atualizar</button><button class="btn pri" onclick="ir('nova')">+ Nova ordem</button></div>
    ${avisoAj}${avisoCamp}${avisoRen}
    ${pend.length?`<div class="card" style="margin-bottom:16px;border-color:var(--info)"><h2>Você tem ${pend.length} nota(s) para pagar</h2>

  ligarLinhas();
}

// ================= ADMIN: FATURAMENTO =================
function vFaturamento(){
  const conc=S.ordens.filter(o=>o.status==='concluida');
  const porMes={}; conc.forEach(o=>{ const d=new Date(o.concluida_em), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    porMes[k]=porMes[k]||{n:0,vol:0,fat:0}; porMes[k].n++; porMes[k].vol+=Number(o.valor_pagamento); porMes[k].fat+=Number(o.valor_taxa); });
  const meses=Object.keys(porMes).sort().reverse();
  const sel = S.fatMes || meses[0] || '';
  const doMes = conc.filter(o=>{const d=new Date(o.concluida_em);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===sel;});
  const porCli={}; doMes.forEach(o=>{const k=o.prem_clientes?.nome||'—'; porCli[k]=porCli[k]||{n:0,vol:0,fat:0}; porCli[k].n++; porCli[k].vol+=Number(o.valor_pagamento); porCli[k].fat+=Number(o.valor_taxa);});
  const nomeMes=k=>{ if(!k) return ''; const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); };
  const csv = () => { const linhas=[['Nº','Concluída em','Cliente','Descrição','Favorecido','Pagamento','Taxa %','Taxa R$','Nota R$','NF']]
      .concat(doMes.map(o=>[o.numero,dt(o.concluida_em),o.prem_clientes?.nome,o.descricao,o.favorecido_nome,o.valor_pagamento,o.taxa_percentual,o.valor_taxa,o.valor_nota,o.numero_nota||'']));
    return linhas.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'); };
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Faturamento</h1><div class="spacer"></div>
      ${meses.length?`<select id="fMes">${meses.map(k=>`<option value="${k}">${nomeMes(k)}</option>`).join('')}</select><button class="btn sm" id="fCsv">Baixar CSV do mês</button>`:''}</div>
    ${!meses.length?`<div class="card empty">O faturamento aparece aqui assim que a primeira ordem for concluída.</div>`:`
    <div class="grid kpis">
      <div class="card kpi"><div class="l">Faturamento · ${nomeMes(sel)}</div><div class="v">${brl(porMes[sel].fat)}</div></div>
      <div class="card kpi"><div class="l">Volume repassado</div><div class="v">${brl(porMes[sel].vol)}</div></div>
      <div class="card kpi"><div class="l">Ordens concluídas</div><div class="v">${porMes[sel].n}</div></div>
      <div class="card kpi"><div class="l">Taxa média efetiva</div><div class="v">${pct(porMes[sel].vol?porMes[sel].fat/porMes[sel].vol*100:0)}</div></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><h2>Por cliente · ${nomeMes(sel)}</h2><table class="tbl"><thead><tr><th>Cliente</th><th class="num">Ordens</th><th class="num">Volume</th><th class="num">Faturamento</th></tr></thead><tbody>
        ${Object.entries(porCli).sort((a,b)=>b[1].fat-a[1].fat).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${brl(v.vol)}</td><td class="num"><b>${brl(v.fat)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>Mês a mês</h2><table class="tbl"><thead><tr><th>Mês</th><th class="num">Ordens</th><th class="num">Volume</th><th class="num">Faturamento</th></tr></thead><tbody>
        ${meses.map(k=>`<tr><td>${nomeMes(k)}</td><td class="num">${porMes[k].n}</td><td class="num">${brl(porMes[k].vol)}</td><td class="num"><b>${brl(porMes[k].fat)}</b></td></tr>`).join('')}</tbody></table></div>
    </div>`}`;
  if(meses.length){
    $('#fMes').value=sel; $('#fMes').onchange=e=>{S.fatMes=e.target.value; vFaturamento();};
    $('#fCsv').onclick=()=>{ const b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`faturamento-${sel}.csv`; a.click(); };
  }
}

iniciar();
