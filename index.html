<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F3">
<meta name="description" content="Mayway Soluções – campanhas de incentivo e pagamento de premiações">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayway">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mayway Soluções · Premiações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* identidade MAY WAY (guia nov/2026) */
  --mw-porcelana:#FAF7F3; --mw-papel:#FFFCF9; --mw-areia:#F0E7DF; --mw-tinta:#263C46; --mw-vermelho:#9D2941;
  --mw-azul-mar:#3F7183; --mw-rosa:#E9ADA1; --mw-linha:#DED3CB; --mw-cinza:#6B7475;
  --bg:var(--mw-porcelana); --card:var(--mw-papel); --ink:var(--mw-tinta); --muted:#5F6869; --line:var(--mw-linha);
  --brand:#1B3B4F; --brand-2:#E4ECF0; --ouro:#C2A15A; --economia:#2F6B57; --warn:#8A4B00; --warn-bg:#F8EBD3;
  --info:#2F5E6F; --info-bg:#E2ECEF; --ok:#2F6B4F; --ok-bg:#E3EFE7; --bad:#9D2941; --bad-bg:#F7E1E3;
  --violet:#5B4A7A; --violet-bg:#ECE7F2; --r:12px;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:Lato,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
h1{font-family:var(--serif);font-weight:500;letter-spacing:-.005em}
.kpi .v{font-family:var(--serif);font-weight:600}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* layout */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{font-family:var(--serif);font-weight:600;font-size:21px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:19px;font-family:var(--serif);font-weight:500;line-height:1}
nav{display:flex;gap:4px;margin-left:12px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav button.on{background:var(--brand-2);color:var(--brand)}
.spacer{flex:1}
.who{color:var(--muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:27px;margin:0 0 16px;line-height:1.15}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pw{position:relative}.pw input{padding-right:44px}.pw .olho{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:#6B7475;line-height:0}.pw .olho:hover{color:var(--brand)}
.lg-esq{display:block;text-align:right;margin:-6px 0 14px}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.modelo{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:inherit}
.modelo:hover,.modelo:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-2)}
.modelo b{font-family:var(--serif);font-size:1.08rem;color:var(--brand)}
.modelo span{font-size:.86rem;color:#5b666b}
.modelo.outro{background:#fafbfc}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:4px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* buttons */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
/* forms */
label{display:block;font-size:12px;font-weight:600;color:#344054;margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
.f{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.calc{background:var(--brand-2);border-radius:10px;padding:12px 14px;display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.calc div{font-size:12px;color:var(--muted)} .calc b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
/* table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select,.toolbar input{width:auto;min-width:170px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-enviada{background:var(--warn-bg);color:var(--warn)}
.st-nota_emitida{background:var(--info-bg);color:var(--info)}
.st-pago_cliente{background:var(--violet-bg);color:var(--violet)}
.st-favorecidos_pagos{background:var(--brand-2);color:var(--brand)}
.pixbox{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.pixqr{width:200px;height:200px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center}
.pixqr svg{width:100%;height:100%}
.st-concluida{background:var(--ok-bg);color:var(--ok)}
.st-cancelada{background:#f2f4f7;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:28px}
.login h1{margin-bottom:4px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:500}
/* modal */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:860px;max-height:92vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:10px;top:8px;background:#f2f4f7;border:0;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);z-index:2}
.dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin:0 0 16px}
.dl dt{color:var(--muted);font-size:13px} .dl dd{margin:0}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps div{flex:1;height:6px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--brand)}
.action{border:1px dashed var(--brand);background:#fbfdfc;border-radius:10px;padding:16px;margin-top:8px}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tl{list-style:none;padding:0;margin:0;font-size:13px}
.tl li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 16px;border-radius:10px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)}

.logo{white-space:nowrap}
nav{overflow-x:auto;scrollbar-width:none} nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:8px 10px}
.who{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* o e-mail do usuário fica dentro do menu Mais */
.who{display:none}
/* menu que se ajusta à largura */
nav{flex:1 1 auto;min-width:0;overflow:hidden}
.bar > .spacer{flex:0 0 0}
.nav-mais .car{font-size:10px;margin-left:2px}
nav .sh{display:none}
.nav-menu{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);padding:6px;min-width:220px;max-width:280px}
.nav-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-weight:500;color:var(--ink,#101828);cursor:pointer;font-size:14px}
.nav-menu button:hover{background:var(--bg,#f4f5f7)}
.nav-menu button.on{background:var(--brand-2);color:var(--brand)}
.nav-menu .nm-quem{padding:8px 12px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-menu .nm-sair{color:var(--bad);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
/* ===== celular ===== */
input,select,textarea{font-size:16px}
header{padding-top:env(safe-area-inset-top)}
@media(max-width:700px){
  body{font-size:15px}
  .bar{padding:10px 14px;gap:10px;flex-wrap:nowrap}
  .logo{font-size:18px}
  .who{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:#fff;border-top:1px solid var(--line);
      display:flex;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(16,24,40,.06)}
  nav button{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 4px;font-size:12px}
  nav{overflow:hidden!important}
  nav .lg{display:none} nav .sh{display:inline}
  nav .nav-mais{flex:0 0 auto;padding:10px 6px} nav .nav-mais .car{display:none}
  nav:empty{display:none}
  .nav-menu{left:8px!important;right:8px;top:auto!important;max-width:none;bottom:calc(64px + env(safe-area-inset-bottom));border-radius:14px}
  .nav-menu button{padding:13px 14px;font-size:15px}
  .btn-sair{display:none}
  main{padding:16px 12px calc(90px + env(safe-area-inset-bottom))}
  h1{font-size:24px}
  .card{padding:14px;border-radius:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:18px}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .toolbar{gap:8px}
  .toolbar h1{flex:1 1 100%}
  .toolbar select,.toolbar input{min-width:0;flex:1 1 100%}
  .toolbar .spacer{display:none}
  .row{grid-template-columns:1fr!important}
  .row.itemrow{grid-template-columns:1fr auto!important;gap:8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .row.itemrow > div:first-child{grid-column:1/-1}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
  .calc{gap:12px}
  .calc div{flex:1 1 40%}
  .btn{padding:11px 14px}
  /* tabelas viram cartões */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px;background:#fff}
  .tbl td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;text-align:right}
  .tbl td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:0 0 auto;padding-top:2px}
  .tbl td[data-label=""]::before{display:none}
  .tbl td[data-label=""]{justify-content:flex-end}
  .tbl td > div{text-align:right}
  .tbl td .tdv{display:block;text-align:right;min-width:0}
  .tbl td .tdv > div{text-align:right}
  .tbl .num{text-align:right}
  /* janelas em tela cheia */
  .modal{padding:0;align-items:stretch}
  .modal .card{max-width:none;max-height:none;height:100%;border-radius:0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));padding-top:calc(18px + env(safe-area-inset-top))}
  .modal .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px}
  .login{padding:16px;align-items:start;padding-top:12vh}
  #__cap{left:10px;right:10px}
}
.sino{position:relative;padding:7px 9px;display:inline-grid;place-items:center}
.sino .badge{position:absolute;top:-6px;right:-6px;background:#d92d20;color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.notif-painel{position:fixed;top:60px;right:max(12px,calc(50vw - 578px));width:380px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,40,.18);z-index:30}
.notif-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.notif-push{margin:12px 14px;padding:12px;border-radius:10px;background:var(--brand-2);display:flex;flex-direction:column;gap:6px;font-size:13px}
.notif-item{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer;font:inherit;color:inherit}
.notif-item:hover{background:#f9fafb}
.notif-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px;background:transparent}
.notif-item.nova{background:#f6fbf9}.notif-item.nova .dot{background:var(--brand)}
.notif-item b{display:block;font-size:13.5px}.notif-item span{display:block;color:var(--muted);font-size:13px;margin-top:2px}.notif-item small{color:var(--muted);font-size:11.5px}
.notif-rodape{padding:10px 16px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.notif-painel{top:calc(56px + env(safe-area-inset-top));left:8px;right:8px;width:auto;max-height:75vh}}
.nfse-box{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-bottom:14px}
.nfse-tab td{padding:6px 4px}
.install-bar{display:none;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:16;background:#101828;color:#fff;border-radius:14px;padding:12px 14px;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.install-bar img{width:36px;height:36px;border-radius:9px}
.install-bar .btn{padding:8px 12px}
@media(min-width:701px){.install-bar{bottom:20px;left:auto;max-width:420px}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="vLogin" class="login hidden">
  <div class="card">
    <div class="logo" style="margin-bottom:18px"><i>M</i> Mayway Soluções</div>
    <h1 id="lgTitle">Entrar</h1>
    <p class="muted" id="lgSub" style="margin:0 0 18px">Acesse para enviar e acompanhar suas ordens de pagamento.</p>
    <div id="lgMsg"></div>
    <form id="lgForm">
      <div class="f"><label>E-mail</label><input id="lgEmail" type="email" required autocomplete="email"></div>
      <div class="f" id="lgPassBox"><label>Senha</label><div class="pw"><input id="lgPass" type="password" minlength="6" autocomplete="current-password"></div></div>
      <button type="button" class="link small lg-esq" id="lgEsq" data-mode="reset">Esqueci minha senha</button>
      <button class="btn pri" style="width:100%;justify-content:center" id="lgBtn">Entrar</button>
    </form>
    <p class="small muted" style="margin:16px 0 0;display:flex;justify-content:space-between">
      <button class="link" data-mode="signup">Primeiro acesso</button>
      <button class="link hidden" data-mode="reset" id="lgEsq2">Esqueci minha senha</button>
    </p>
    <p class="small" style="margin:12px 0 0;text-align:center"><button type="button" class="link" onclick="abrirVideo('videos/manual-cliente.mp4','Como usar o sistema')">▶ Vídeo: como usar o sistema</button></p>
  </div>
</section>

<!-- ===== SEM VÍNCULO ===== -->
<section id="vNoLink" class="login hidden">
  <div class="card">
    <h1>Acesso não liberado</h1>
    <p class="muted">O e-mail <b id="nlEmail"></b> ainda não está cadastrado como cliente. Peça ao administrador para cadastrar este e-mail e tente de novo.</p>
    <button class="btn" onclick="sair()">Sair</button>
  </div>
</section>

<!-- ===== APP ===== -->
<div id="vApp" class="hidden">
  <header><div class="bar">
    <div class="logo"><i>M</i> Mayway Soluções</div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn sm btn-sair" onclick="alterarMinhaSenha()" title="Alterar minha senha">Senha</button>
    <button class="btn sm btn-sair" onclick="sair()">Sair</button>
  </div><div id="navMenu" class="nav-menu hidden" role="menu"></div></header>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card"><button class="x" onclick="fecharModal()">×</button><div id="modalBody"></div></div></div>

<script>
// ================= CELULAR: rótulos das tabelas, instalar app =================
function rotularTabelas(root){ (root||document).querySelectorAll('table.tbl').forEach(t=>{ const ths=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
  t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(td.hasAttribute('data-label')) return; td.setAttribute('data-label', ths[i]||''); if(td.childNodes.length>1){ const w=document.createElement('div'); w.className='tdv'; while(td.firstChild) w.appendChild(td.firstChild); td.appendChild(w); } })); }); }
new MutationObserver(()=>rotularTabelas()).observe(document.body,{childList:true,subtree:true});
let promptInstalar=null;
const ehIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstalar=e; mostrarBarraInstalar(); });
function mostrarBarraInstalar(){ try{ if(standalone || localStorage.getItem('mw_inst_ok')) return; }catch(e){}
  if(!promptInstalar && !(ehIOS)) return;
  let b=document.getElementById('instBar'); if(!b){ b=document.createElement('div'); b.id='instBar'; b.className='install-bar'; document.body.appendChild(b); }
  b.innerHTML=`<img src="icons/icon-192.png" alt=""><div style="flex:1"><b>Instale o app Mayway</b><div class="small" style="opacity:.8">Ícone na tela inicial, abre como aplicativo.</div></div><button class="btn pri" id="instGo">Instalar</button><button class="btn" id="instNo" style="background:transparent;color:#fff;border-color:#475467">Agora não</button>`;
  b.style.display='flex';
  $('#instNo').onclick=()=>{ b.style.display='none'; try{ localStorage.setItem('mw_inst_ok','1'); }catch(e){} };
  $('#instGo').onclick=async()=>{ if(promptInstalar){ promptInstalar.prompt(); const r=await promptInstalar.userChoice; promptInstalar=null; b.style.display='none'; if(r.outcome==='accepted') try{ localStorage.setItem('mw_inst_ok','1'); }catch(e){} }
    else { b.style.display='none'; abrirModal(instrucoesInstalar()); } };
}

async function upload(clienteId, ordemId, tipo, file){
  if(!file) return null;
  if(file.size > 15*1024*1024) throw new Error('Arquivo maior que 15 MB.');
  const ext = (file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = `${clienteId}/${ordemId}/${tipo}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw error;
  return path;
}
async function abrirArquivo(path){
  if(/\/nfse-[^/]*\.xml$/.test(path)) return verDanfse(path);
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300);
  if(error){ w && w.close(); return toast(error.message, true); }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

  box.innerHTML = `<div class="toolbar" style="margin:0 0 6px"><b>⚡ Emissão automática</b><div class="spacer"></div>
      <span class="pill ${prod?'st-concluida':'st-enviada'}">${prod?'Produção (nota real)':'Homologação (teste, sem valor fiscal)'}</span></div>

  box.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.file));
  $('#nfAutoBtn') && ($('#nfAutoBtn').onclick=()=>{

      toast(data.ambiente===1?`NFS-e nº ${data.numero} emitida e ordem concluída.`:`Teste ok: nota de homologação nº ${data.numero} gerada.`);

// DANFSe gerado no navegador a partir do XML oficial da NFS-e
async function verDanfse(path){
  const w = window.open('', '_blank');
  if(w) w.document.write('<p style="font:14px Arial;padding:24px">Carregando a NFS-e…</p>');
  const { data, error } = await sb.storage.from(BUCKET).download(path);
  if(error){ w&&w.close(); return toast(error.message,true); }
  const xml = new DOMParser().parseFromString(await data.text(), 'application/xml');
  const all = (n, ctx=xml) => [...ctx.getElementsByTagNameNS('*', n)];
  const g = (n, ctx=xml) => all(n, ctx)[0]?.textContent?.trim() || '';
  const inf = all('infNFSe')[0] || xml, dps = all('infDPS')[0] || xml;
  const emit = all('emit')[0] || xml, prest = all('prest', dps)[0] || xml, toma = all('toma', dps)[0];
  const vNf = all('valores', inf).find(v=>v.parentNode===inf) || xml;
  const chave = ((inf.getAttribute && inf.getAttribute('Id'))||'').replace(/^NFS/,'');
  const num = v => (v===''||v==null)? null : Number(v);
  const m = v => v==null||isNaN(v) ? '-' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const tx = v => esc(v||'-');
  const doc = ctx => ctx ? (fmtDoc(g('CNPJ',ctx)||g('CPF',ctx))||'-') : '-';
  const fone = v => { const d=soDig(v); return d.length>=10 ? d.replace(/^(\d{2})(\d{4,5})(\d{4})$/,'($1) $2-$3') : (v||'-'); };
  const cep = v => { const d=soDig(v); return d.length===8 ? d.replace(/(\d{5})(\d{3})/,'$1-$2') : (v||'-'); };
  const nomeMun = cod => cod===g('cLocIncid',inf) ? g('xLocIncid',inf) : (cod===g('cLocEmi',dps)||cod===g('cMun',emit) ? g('xLocEmi',inf) : '');
  const ender = (ctx) => ctx ? [g('xLgr',ctx), g('nro',ctx), g('xCpl',ctx), g('xBairro',ctx)].filter(Boolean).join(', ') : '';
  const munUf = (ctx) => { if(!ctx) return '-'; const c=g('cMun',ctx); const n=nomeMun(c); const uf=g('UF',ctx)|| (c.startsWith('31')?'MG':''); return (n?n:c)+(uf?' - '+uf:''); };

  const c = (rot, val, cls='') => `<div class="c ${cls}"><span>${rot}</span><b>${val}</b></div>`;

const camposNovaSenha=()=>`<div class="f"><label>Nova senha (mínimo 8 caracteres)</label><div class="pw"><input id="np" type="password" minlength="8" autocomplete="new-password"></div></div>

function gerarSenha(){ const cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const r=crypto.getRandomValues(new Uint32Array(10)); return [...r].map(x=>cs[x%cs.length]).join(''); }

$('#lgForm').onsubmit = e => { e.preventDefault(); busy($('#lgBtn'), async ()=>{
  const email=$('#lgEmail').value.trim(), password=$('#lgPass').value;
  const msg=(t,ok)=>$('#lgMsg').innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`;
  if(lgMode==='reset'){
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
    if(error) return msg(/not authorized|rate limit/i.test(error.message)?'Não conseguimos enviar o e-mail agora. Fale com a Mayway pelo WhatsApp (31) 7306-8089 que definimos uma nova senha para você.':error.message);
    return msg('Pronto! Se este e-mail tiver acesso, o link para criar uma nova senha chega em instantes. Veja também o spam. Não chegou? Fale com a Mayway pelo WhatsApp (31) 7306-8089.',true);
  }
  if(!password || password.length<6) return msg('A senha precisa ter pelo menos 6 caracteres.');
  if(lgMode==='signup'){
    const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
    if(error) return msg(error.message.includes('already')?'Este e-mail já tem acesso. Use "Entrar" com a sua senha ou "Esqueci minha senha".':error.message);

      setLgMode('login'); return msg('Este e-mail já tem acesso. Entre com a sua senha ou clique em "Esqueci minha senha" para criar uma nova.');

async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show('vLogin'); return; }
  S.user = session.user;
  const { data, error } = await sb.rpc('prem_vincular');
  if(error){ toast(error.message,true); show('vLogin'); return; }
  S.papel = data?.papel; S.clienteId = data?.cliente_id || null;
  if(!S.papel){ $('#nlEmail').textContent=S.user.email; show('vNoLink'); return; }
  show('vApp');
  $('#who').textContent = S.user.email + (S.papel==='admin'?' · admin':'');
  if(S.papel==='admin'){
    montarNav([['painel','Painel'],['ordens','Ordens'],['campanhas','Campanhas'],['clientes','Clientes'],['faturamento','Faturamento'],['indicadores','Indicadores'],['favorecidos','Favorecidos'],['nova','Nova ordem'],['contrato','Contrato'],['equipe','Equipe'],['ajuda','Ajuda']]);
    await carregar(); ir(S.tab||'painel'); iniciarNotificacoes(); abrirPeloHash();
  } else {
    const { data:c } = await sb.from('prem_clientes').select('*').eq('id',S.clienteId).single();
    S.cliente = c;
    const { data:cfgc } = await sb.from('prem_config').select('contrato_exigir').single();
    if(cfgc?.contrato_exigir && !c?.contrato_aceito_em){ $('#who').textContent = S.user.email; vContratoGate(); return; }
    montarNav([['minhas','Minhas ordens'],['nova','Nova ordem'],['campanhas','Campanhas'],['favorecidos','Favorecidos']].concat(c?.contrato_aceito_em?[['contrato','Contrato']]:[]).concat([['ajuda','Ajuda']]));
    await carregar(); ir(S.tab||'minhas'); iniciarNotificacoes(); abrirPeloHash();
  }
}
function montarNav(items){
  S.navItems = items;
  const curto={'Minhas ordens':'Ordens','Nova ordem':'+ Nova','Favorecidos':'Favorec.','Faturamento':'Faturam.','Indicadores':'Indicad.'};
  $('#nav').innerHTML = items.map(([k,l])=>`<button data-tab="${k}" title="${l}"><span class="lg">${l}</span><span class="sh">${curto[l]||l}</span></button>`).join('')
    + `<button class="nav-mais" id="navMais" aria-haspopup="true">Mais <span class="car">▾</span></button>`;
  $('#nav').querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{ fecharMenuNav(); ir(b.dataset.tab); });
  $('#navMais').onclick=(e)=>{ e.stopPropagation(); $('#navMenu').classList.contains('hidden')?abrirMenuNav():fecharMenuNav(); };
  ajustarNav();
}
// mostra no menu só o que cabe; o resto vai para "Mais"
function ajustarNav(){
  const nav=$('#nav'); if(!nav||!S.navItems) return;
  const bts=[...nav.querySelectorAll('button[data-tab]')], mais=$('#navMais');
  bts.forEach(b=>b.style.display=''); mais.style.display='none';
  let ocultos=[];
  const cel=matchMedia('(max-width:700px)').matches;
  if(cel){ ocultos=bts.slice(4); }
  else if(nav.scrollWidth>nav.clientWidth+1){
    mais.style.display='';
    for(let i=bts.length-1;i>=0 && nav.scrollWidth>nav.clientWidth+1;i--){ bts[i].style.display='none'; ocultos.unshift(bts[i]); }
  }
  ocultos.forEach(b=>b.style.display='none');
  mais.style.display = (ocultos.length||cel)?'':'none';
  S.navOcultos = ocultos.map(b=>b.dataset.tab);
  marcarNav();
}
function marcarNav(){
  const nav=$('#nav'); if(!nav) return;
  nav.querySelectorAll('button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const m=$('#navMais'); if(m) m.classList.toggle('on',(S.navOcultos||[]).includes(S.tab));
}
function abrirMenuNav(){
  const menu=$('#navMenu'), itens=(S.navItems||[]).filter(([k])=>(S.navOcultos||[]).includes(k));
  menu.innerHTML = `<div class="nm-quem">${esc(S.user?.email||'')}${S.papel==='admin'?' · admin':''}</div>`
    + itens.map(([k,l])=>`<button data-tab="${k}" class="${k===S.tab?'on':''}">${l}</button>`).join('')
    + `<button onclick="alterarMinhaSenha()">Alterar minha senha</button><button class="nm-sair" onclick="sair()">Sair</button>`;
  menu.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{ fecharMenuNav(); ir(b.dataset.tab); });
  const r=$('#navMais').getBoundingClientRect();
  if(!matchMedia('(max-width:700px)').matches){ menu.style.top=(r.bottom+6)+'px'; menu.style.left=Math.max(8,Math.min(r.left, innerWidth-menu.offsetWidth-8, innerWidth-248))+'px'; }
  else { menu.style.top=''; menu.style.left=''; }
  menu.classList.remove('hidden'); $('#navMais').setAttribute('aria-expanded','true');
}
function fecharMenuNav(){ const m=$('#navMenu'); if(m) m.classList.add('hidden'); const b=$('#navMais'); if(b) b.setAttribute('aria-expanded','false'); }
document.addEventListener('click',e=>{ const m=$('#navMenu'); if(m && !m.classList.contains('hidden') && !m.contains(e.target)) fecharMenuNav(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fecharMenuNav(); });
let _tNav, _wNav=0; addEventListener('resize',()=>fecharMenuNav());
// reajusta sempre que o espaço do menu muda (tela, sino, nome do usuário, fontes)
if(window.ResizeObserver) new ResizeObserver(()=>{ const w=$('#nav')?.clientWidth||0; if(w===_wNav) return; _wNav=w; clearTimeout(_tNav); _tNav=setTimeout(ajustarNav,60); }).observe(document.getElementById('nav'));
else addEventListener('resize',()=>{ clearTimeout(_tNav); _tNav=setTimeout(ajustarNav,120); });
if(document.fonts) document.fonts.ready.then(()=>ajustarNav());
function ir(tab){
  S.tab=tab; marcarNav();
  ({painel:vPainel, ordens:vOrdens, clientes:vClientes, faturamento:vFaturamento, indicadores:vIndicadores, minhas:vMinhas, nova:vNova, favorecidos:vFavorecidos, campanhas:vCampanhas, equipe:vEquipe, ajuda:vAjuda, contrato:()=>{ if(S.papel==='admin') vContratoAdmin(); else { S.tab='minhas'; vMinhas(); marcarNav(); verContratoAssinado(S.clienteId); } }}[tab])();
}

async function carregar(){
  const q = sb.from('prem_ordens').select('*, prem_clientes(nome), prem_campanhas(nome,numero)').order('created_at',{ascending:false}).limit(1000);
  const [o, c, f, cfg, cp] = await Promise.all([ q, S.papel==='admin' ? sb.from('prem_clientes').select('*').order('nome') : Promise.resolve({data:[]}),
    sb.from('prem_favorecidos').select('*').eq('ativo',true).order('nome'), sb.from('prem_config').select('*').single(), sb.from('prem_campanhas').select('*, prem_clientes(nome)').order('periodo_inicio',{ascending:false}) ]);
  if(o.error) toast(o.error.message,true);
  if(S.papel==='admin'){ const [ri, rc] = await Promise.all([ sb.from('prem_indicadores').select('*').order('nome'), sb.from('prem_comissoes').select('*').order('pago_cliente_em',{ascending:false}).limit(5000) ]); S.inds = ri.data||[]; S.comis = rc.data||[]; }
  S.ordens = o.data||[]; S.clientes = c.data||[]; S.favs = f.data||[]; if(cfg.data){ S.custoTed = Number(cfg.data.custo_ted); S.prazoPos = cfg.data.prazo_pos_campanha_dias; S.durMax = cfg.data.duracao_max_meses; S.avisoRen = cfg.data.aviso_renovacao_dias; } S.camps = cp.data||[];
}
async function recarregar(){ await carregar(); ir(S.tab); }
setInterval(()=>{ if(S.papel && $('#modal').classList.contains('hidden') && !['nova','favorecidos'].includes(S.tab)) recarregar(); }, 60000);

function vPainel(){
  const now=new Date(), ini=new Date(now.getFullYear(),now.getMonth(),1);
  const conc = S.ordens.filter(o=>o.status==='concluida');
  const mes = conc.filter(o=>new Date(o.concluida_em)>=ini);
  const pipe = S.ordens.filter(o=>['enviada','nota_emitida','pago_cliente','favorecidos_pagos'].includes(o.status));
  const cnt = s => S.ordens.filter(o=>o.status===s).length;
  const fatMes = mes.reduce((a,o)=>a+Number(o.valor_taxa),0);
  const fatPipe = pipe.reduce((a,o)=>a+Number(o.valor_taxa),0);
  const volMes = mes.reduce((a,o)=>a+Number(o.valor_pagamento),0);
  const acao = S.ordens.filter(o=>['enviada','pago_cliente','favorecidos_pagos'].includes(o.status));
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Painel</h1><div class="spacer"></div><button class="btn sm" onclick="recarregar()">Atualizar</button></div>
    <div class="grid kpis">
      <div class="card kpi"><div class="l">Faturamento do mês</div><div class="v">${brl(fatMes)}</div><div class="s">${mes.length} ordens concluídas</div></div>
      <div class="card kpi"><div class="l">Faturamento em andamento</div><div class="v">${brl(fatPipe)}</div><div class="s">${pipe.length} ordens abertas</div></div>
      <div class="card kpi"><div class="l">Volume pago no mês</div><div class="v">${brl(volMes)}</div><div class="s">repassado aos favorecidos</div></div>
      <div class="card kpi"><div class="l">Precisam de você</div><div class="v">${acao.length + S.camps.filter(c=>c.status==='em_analise').length}</div><div class="s">${cnt('enviada')} cobrar · ${cnt('pago_cliente')} pagar · ${cnt('favorecidos_pagos')} emitir NF · ${S.camps.filter(c=>c.status==='em_analise').length} campanha(s) p/ aprovar</div></div>
    </div>
    <div class="card"><h2>Fila de ação</h2>${tabelaOrdens(acao, true)}</div>`;
  ligarLinhas();
}

// ================= ADMIN: ORDENS =================
function vOrdens(){
  const f=S.filtro;
  const nArq=S.ordens.filter(o=>o.arquivada_em).length;
  let lista = S.ordens.filter(o=>{
    if(!!o.arquivada_em !== !!S.verArq) return false;
    if(f.status==='acao' && !['enviada','pago_cliente','favorecidos_pagos'].includes(o.status)) return false;
    if(f.status && f.status!=='acao' && o.status!==f.status) return false;
    if(f.cliente && o.cliente_id!==f.cliente) return false;
    if(f.q){ const t=(o.descricao+' '+o.favorecido_nome+' '+o.numero+' '+(o.numero_nota||'')+' '+(o.prem_clientes?.nome||'')).toLowerCase(); if(!t.includes(f.q.toLowerCase())) return false; }
    return true; });
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Ordens</h1><div class="spacer"></div><button class="btn pri" onclick="ir('nova')">+ Nova ordem</button></div>
    <div class="card">
      <div class="toolbar">
        <select id="fSt"><option value="acao">Precisam de mim</option><option value="">Todos os status</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')}</select>
        <select id="fCli"><option value="">Todos os clientes</option>${S.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>
        <input id="fQ" placeholder="Buscar descrição, favorecido, nº…" value="${esc(f.q)}">
        <span class="muted small">${lista.length} ordens</span>
        ${nArq||S.verArq?`<button class="btn sm" id="fArq">${S.verArq?'Voltar às ordens ativas':'Ver arquivadas ('+nArq+')'}</button>`:''}
      </div>
      ${tabelaOrdens(lista, true)}
    </div>`;
  $('#fSt').value=f.status; $('#fCli').value=f.cliente;
  $('#fSt').onchange=e=>{f.status=e.target.value;vOrdens();};
  $('#fArq') && ($('#fArq').onclick=()=>{ S.verArq=!S.verArq; if(S.verArq) f.status=''; vOrdens(); });
  $('#fCli').onchange=e=>{f.cliente=e.target.value;vOrdens();};
  $('#fQ').onchange=e=>{f.q=e.target.value;vOrdens();};
  ligarLinhas();
}
function tabelaOrdens(lista, admin){
  if(!lista.length) return `<div class="empty">Nenhuma ordem por aqui.</div>`;
  return `<div class="tblwrap"><table class="tbl"><thead><tr>
    <th>Nº</th><th>Data</th>${admin?'<th>Cliente</th>':''}<th>Descrição / favorecido</th>
    <th class="num">Pagamento</th>${admin?'<th class="num">Taxa</th>':''}<th class="num">Valor total</th><th>Status</th></tr></thead><tbody>
    ${lista.map(o=>`<tr class="click" data-id="${o.id}">
      <td>#${o.numero}</td><td>${dt(o.created_at)}</td>${admin?`<td>${esc(o.prem_clientes?.nome)}</td>`:''}
      <td><div>${esc(o.descricao)}</div><div class="muted small">${esc(o.favorecido_nome)}${o.vencimento?' · vence '+dIso(o.vencimento):''}</div></td>
      <td class="num">${brl(o.valor_pagamento)}</td>
      ${admin?`<td class="num">${brl(o.valor_taxa)}<div class="muted small">${pct(o.taxa_percentual)}</div></td>`:''}
      <td class="num"><b>${brl(o.valor_nota)}</b></td><td>${pill(o.status, !admin)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function ligarLinhas(){ document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>detalhe(tr.dataset.id)); }

// ================= DETALHE / AÇÕES =================

    ${itens.map(i=>`<tr><td><b>${esc(i.nome)}</b></td><td>${esc(fmtDoc(i.cpf))}</td><td class="small">${esc(i.dados_pagamento)}${Number(i.custo_transferencia)?` <span class="muted">(+${brl(i.custo_transferencia)} TED)</span>`:''}</td><td class="num">${brl(i.valor)}</td>${temPg?`<td>${i.pago_em?dIso(i.pago_em):'—'}${i.comprovante?` <button class="btn sm" data-file="${esc(i.comprovante)}">📎 Comprovante</button>`:''}</td>`:''}</tr>`).join('')}
    </tbody></table></div>` : `<p>${esc(o.favorecido_nome||'—')} <span class="muted">${esc(o.dados_pagamento||'')}</span></p>`;

  const step = ST[o.status].step;

        :`<p class="small" style="margin:8px 0;color:var(--bad)">Cadastre a chave PIX da Mayway em <b>Contrato › Dados da nossa empresa</b> antes de enviar a cobrança.</p>`}
      <button class="btn pri" id="aBtn" ${cfg.contratada_pix?'':'disabled'}>Enviar cobrança</button></div>`;

  if(!admin && o.status==='nota_emitida') acao = `<div class="action"><h2>Pague por PIX e envie o comprovante</h2>
      <div class="pixbox"><div id="pixQr" class="pixqr"></div>
        <div style="flex:1;min-width:220px"><div class="muted small">Valor</div><div style="font-size:26px;font-weight:700;margin-bottom:6px">${brl(o.valor_nota)}</div>

      ${its.map(i=>`<tr data-item="${i.id}"><td><b>${esc(i.nome)}</b><div class="small muted">CPF ${esc(fmtDoc(i.cpf))}</div>

          <div class="small pCompNome" style="margin-top:4px;color:var(--economia);word-break:break-all"></div></td>

        <td class="num">${brl(i.valor)} <button type="button" class="btn sm" data-cp="${Number(i.valor).toFixed(2).replace('.',',')}">Copiar</button></td>

      <details><summary style="cursor:pointer;margin:4px 0 10px"><b>Emitir manualmente no portal (Emissor Nacional)</b></summary>

        <table class="tbl nfse-tab"><tbody id="nfValores"></tbody></table>
        <label style="margin-top:10px">Deduções – documentos (um por favorecido)</label>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>Tipo</th><th>CPF</th><th>Nome</th><th>Data</th><th class="num">Valor</th></tr></thead><tbody>
        ${its.map(i=>`<tr><td class="small">99 – Outras deduções (repasse)</td><td>${esc(fmtDoc(i.cpf))}</td><td>${esc(i.nome)}
          <div class="small muted">${i.endereco?esc(`${i.endereco.logradouro}, ${i.endereco.numero}${i.endereco.complemento?' '+i.endereco.complemento:''} – ${i.endereco.bairro} – ${i.endereco.cidade}/${i.endereco.uf} – CEP ${String(i.endereco.cep).replace(/^(\d{5})(\d{3})$/,'$1-$2')}`):`<button type="button" class="btn sm" data-endfav="${i.favorecido_id}">⚠ Completar endereço</button>`}</div></td><td>${dIso(i.pago_em)}</td><td class="num">${brl(i.valor)}</td></tr>`).join('')}
        ${Number(o.custo_transferencia)?`<tr><td class="small">99 – Outras deduções (tarifa TED)</td><td>—</td><td>Custo de transferência</td><td>—</td><td class="num">${brl(o.custo_transferencia)}</td></tr>`:''}
        </tbody></table></div>
        <label style="margin-top:10px">Discriminação dos serviços</label><textarea id="nfTexto" readonly style="min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px"></textarea>
        <p class="small muted" style="margin:6px 0 0">Código 17.06.01 · NBS 1.1406.19.00. Valor do serviço = total; deduções = repasses + TED (por documentos); base de cálculo do ISS = taxa.</p></div>
      <div class="row"><div class="f"><label>Nº da NFS-e</label><input id="aNum"></div><div class="f"><label>PDF da NFS-e</label><input id="aFile" type="file" accept=".pdf,image/*"></div></div>
      <button class="btn pri" id="aBtn">Enviar NFS-e e concluir</button></details></div>`;
  if(!admin && o.status==='favorecidos_pagos') acao = `<div class="action"><p class="muted" style="margin:0">Todos os favorecidos foram pagos (comprovantes acima). A nota fiscal será emitida em seguida.</p></div>`;
  const podeCancelar = !['concluida','cancelada','favorecidos_pagos'].includes(o.status) && (admin || o.status==='enviada');
  abrirModal(`

    <div>${pill(o.status, !admin)}</div>
    ${step?`<div class="steps">${[1,2,3,4,5].map(i=>`<div class="${i<=step?'on':''}"></div>`).join('')}</div>`:'<div style="height:14px"></div>'}
    <dl class="dl">
      ${admin?`<dt>Cliente</dt><dd>${esc(o.prem_clientes?.nome)}</dd>`:''}

      <dt>Total dos pagamentos</dt><dd>${brl(o.valor_pagamento)}</dd>
      <dt>${admin?'Sua taxa':'Taxa de serviço'}</dt><dd>${brl(o.valor_taxa)} <span class="muted">(${pct(o.taxa_percentual)})</span></dd>
      ${Number(o.custo_transferencia)?`<dt>Custo de TED</dt><dd>${brl(o.custo_transferencia)}</dd>`:''}
      <dt>Valor total (cobrança)</dt><dd><b>${brl(o.valor_nota)}</b>${o.numero_nota?` <span class="muted">· NFS-e ${esc(o.numero_nota)}</span>`:''}</dd>
      ${o.observacao?`<dt>Observação</dt><dd style="white-space:pre-wrap">${esc(o.observacao)}</dd>`:''}
      ${o.motivo_cancelamento?`<dt>Motivo do cancelamento</dt><dd>${esc(o.motivo_cancelamento)}</dd>`:''}

    ${acao}
    <h2 style="margin-top:20px">Histórico</h2>
    <ul class="tl">${(hist||[]).map(h=>`<li><span>${esc(HST[h.status]||h.status)}${h.observacao?' — '+esc(h.observacao):''}</span><span class="muted">${dth(h.created_at)}</span></li>`).join('')}</ul>
    ${podeCancelar?`<div style="margin-top:18px;display:flex;gap:8px;align-items:center"><input id="cMot" placeholder="Motivo do cancelamento" style="max-width:320px"><button class="btn danger sm" id="cBtn">Cancelar ordem</button></div>`:''}
    ${admin?(()=>{ const semDinheiro=['enviada','nota_emitida','cancelada'].includes(o.status) && !o.anexo_comprovante_cliente && !o.anexo_comprovante_pagamento && !o.numero_nota && !o.anexo_nota && !(itens||[]).some(i=>i.pago_em);
      const podeArq=['concluida','cancelada'].includes(o.status);
      if(!semDinheiro && !podeArq && !o.arquivada_em) return '';
      return `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center">

        ${semDinheiro?`<button class="btn sm danger" id="oExc">Excluir ordem</button>`:''}
        <span class="muted small">${semDinheiro?'Sem pagamento nem nota: pode ser excluída de vez.':'Já teve pagamento ou nota: só pode ser arquivada (sai das listas, continua no faturamento).'}</span></div>`; })():''}
  `);
  document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.file));
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copiar(b.dataset.cp,'Copiado.'));
  const btn=$('#aBtn');
  if(admin && o.status==='enviada'){
    const upd=()=>{ const t=parseValor($('#aTaxa').value), tx=Math.round(o.valor_pagamento*t)/100, ted=Number(o.custo_transferencia||0);
      $('#aCalc').innerHTML=`<div>Pagamentos<b>${brl(o.valor_pagamento)}</b></div><div>Sua taxa<b>${brl(tx)}</b></div>${ted?`<div>Custo TED<b>${brl(ted)}</b></div>`:''}<div>Valor da cobrança<b>${brl(Number(o.valor_pagamento)+tx+ted)}</b></div>`; };
    $('#aTaxa').oninput=upd; upd();
    btn.onclick=()=>busy(btn,async()=>{
      const {error}=await sb.rpc('prem_enviar_cobranca',{p_ordem:o.id,p_taxa:parseValor($('#aTaxa').value)});
      if(error) throw error; toast('Cobrança enviada ao cliente.'); fecharModal(); recarregar(); });
  }
  if(!admin && o.status==='nota_emitida'){
    const payload = cfg.contratada_pix ? pixPayload({chave:cfg.contratada_pix, nome:cfg.contratada_razao||'Mayway Solucoes', cidade:cfg.contratada_cidade||'Belo Horizonte', valor:o.valor_nota, txid:'ORDEM'+o.numero}) : '';
    $('#pixChave').onclick=()=>copiar(cfg.contratada_pix||'','Chave PIX copiada.');
    $('#pixCola').onclick=()=>copiar(payload,'PIX copia e cola copiado. Cole no app do banco.');
    if(payload) desenharQr($('#pixQr'), payload);
  }
  if(o.status==='nota_emitida' && btn){
    btn.onclick=()=>busy(btn,async()=>{
      const f=$('#aFile').files[0]; if(!f) throw new Error('Anexe o comprovante.');
      const path=await upload(o.cliente_id,o.id,'comprovante',f);
      const {error}=await sb.rpc('prem_cliente_enviar_comprovante',{p_ordem:o.id,p_anexo:path});
      if(error) throw error; toast('Comprovante enviado.'); fecharModal(); recarregar(); });
  }
  if(admin && o.status==='pago_cliente'){
    $('#pDescCp').onclick=()=>copiar($('#pDesc').value,'Descrição copiada. Cole no campo "mensagem/descrição" do PIX.');
    document.querySelectorAll('tr[data-item] .pComp').forEach(inp=>inp.onchange=()=>{ const tr=inp.closest('tr'), f=inp.files[0];

      const trs=[...document.querySelectorAll('tr[data-item]')];

      if(linhas.some(l=>!l.pago_em)) throw new Error('Informe a data de pagamento de todos os favorecidos.');
      const f=$('#aFile').files[0];
      const falta=linhas.filter(l=>!l.arq && !its.find(i=>i.id===l.id)?.comprovante);
      if(!f && falta.length) throw new Error(`Anexe o comprovante de ${falta.map(l=>l.nome).join(', ')} (ou um PDF com todos).`);
      for(const [ix,l] of linhas.entries()){ if(l.arq){ btn.textContent=`Enviando comprovante de ${l.nome}…`; l.comprovante=await upload(o.cliente_id,o.id,'pagamento-'+(ix+1),l.arq); } delete l.arq; delete l.nome; }
      const path=f?await upload(o.cliente_id,o.id,'pagamento',f):null;
      const {error}=await sb.rpc('prem_registrar_pagamentos',{p_ordem:o.id,p_anexo:path,p_itens:linhas});
      if(error) throw error; toast('Pagamentos registrados. Agora emita a NFS-e.'); fecharModal(); recarregar(); });
  }
  document.querySelectorAll('[data-endfav]').forEach(b=>b.onclick=()=>formFav(b.dataset.endfav, o.cliente_id, ()=>detalhe(o.id)));
  if(admin && o.status==='favorecidos_pagos') montarNfseAuto(o);
  if(admin && o.status==='favorecidos_pagos'){
    const rep_=Number(o.valor_pagamento), tx=Number(o.valor_taxa), ted=Number(o.custo_transferencia||0);
    $('#nfValores').innerHTML=[['Valor total do serviço',rep_+tx+ted],['Deduções (repasses + TED)',rep_+ted],['Base de cálculo do ISS (taxa)',tx]].map(([l,v])=>`<tr><td>${l}</td><td class="num"><b>${brl(v)}</b></td></tr>`).join('');
    $('#nfTexto').value=textoNfse(o, its, cliNome, cfg);
    $('#nfCopiar').onclick=()=>copiar($('#nfTexto').value,'Discriminação copiada. Cole no Emissor Nacional.');

const TEXTO_REPASSE_PADRAO = 'Premiação ordem {ORDEM} – por conta e ordem de {CLIENTE}';
async function cfgEmpresa(){
  if(!S.cfgNota){ const {data}=await sb.from('prem_config').select('*').single(); S.cfgNota=data||{}; }
  return S.cfgNota;
}
function textoRepasse(cfg, o, cliente){
  return (cfg.texto_repasse||TEXTO_REPASSE_PADRAO).replace(/\{ORDEM\}/g, o.numero).replace(/\{CLIENTE\}/g, cliente||'')
    .replace(/\{CAMPANHA\}/g, o.prem_campanhas?.nome||'').slice(0,140);
}
function hojeIso(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
async function copiar(t, msg){ try{ await navigator.clipboard.writeText(t); toast(msg||'Copiado.'); }catch(e){ toast('Não consegui copiar automaticamente: selecione e copie.',true); } }
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function pixPayload({chave,nome,cidade,valor,txid}){
  const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').trim().toUpperCase();
  let k=String(chave||'').trim();
  if(/^[\d.\-\/ ]+$/.test(k) && [11,14].includes(k.replace(/\D/g,'').length)) k=k.replace(/\D/g,'');   // CPF/CNPJ sem pontuação
  else if(/^\(?\d{2}\)?[\d \-]{8,11}$/.test(k)) k='+55'+k.replace(/\D/g,'');                             // telefone
  else if(k.includes('@')) k=k.toLowerCase();
  const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',k))+tlv('52','0000')+tlv('53','986')
    +(Number(valor)>0?tlv('54',Number(valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',norm(nome).slice(0,25)||'MAYWAY')
    +tlv('60',norm(cidade).slice(0,15)||'BELO HORIZONTE')+tlv('62',tlv('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return p+crc16(p);
}
let _qrLib;
function desenharQr(el, texto){
  _qrLib = _qrLib || new Promise((ok,nok)=>{ if(window.maywayQrSvg) return ok(); const sc=document.createElement('script');
    sc.src='vendor/qrcode.js'; sc.onload=ok; sc.onerror=nok; document.head.appendChild(sc); });
  _qrLib.then(()=>{ el.innerHTML=window.maywayQrSvg(texto); })
    .catch(()=>{ _qrLib=null; el.innerHTML='<div class="small muted" style="padding:10px">Use o “PIX copia e cola”.</div>'; });
}

function mascCpf(c){ const d=String(c||'').replace(/\D/g,''); return d.length===11?`***.${d.slice(3,6)}.${d.slice(6,9)}-**`:fmtDoc(c); }
function textoNfse(o, itens, cliente, cfg){
  cfg=cfg||{}; const f=v=>brl(v).replace(/\u00a0/g,' ');
  const rep_=Number(o.valor_pagamento), tx=Number(o.valor_taxa), ted=Number(o.custo_transferencia||0);
  const linhas=[`Campanha de Incentivo – ${o.prem_campanhas?.nome||''} – Ordem nº ${o.numero}`, `Valor Total: ${f(rep_+tx+ted)}`, 'Sendo:', '',
    `• Premiações pagas aos favorecidos em nome e por conta e ordem de ${cliente}: ${f(rep_)}`,
    `• Taxa de administração da campanha: ${f(tx)}`];
  if(ted) linhas.push(`• Custo de transferência (TED): ${f(ted)}`);
  linhas.push('', 'Pagamentos realizados por conta e ordem do tomador:');
  (itens||[]).forEach(i=>linhas.push(`- ${i.nome} – CPF ${mascCpf(i.cpf)} – ${dIso(i.pago_em)} – ${f(i.valor)}`));
  linhas.push('', 'Observações:', `- Base de cálculo do ISS: ${f(tx)} (somente a taxa de administração).`,
    `- Deduções: ${f(rep_+ted)} – valores repassados a terceiros por conta e ordem do tomador${ted?' e tarifas de transferência':''}, comprovados por documentos, que não constituem receita do prestador.`,
    `- Serviço já quitado pelo tomador via PIX. Comprovantes vinculados à ordem nº ${o.numero}.`);
  return linhas.join('\n');
}

function ligarCep(p){
  const busca=async()=>{ const c=soDig($('#'+p+'Cep').value); if(c.length!==8) return; $('#'+p+'Cep').value=fmtCep(c);
    try{ const r=await fetch(`https://viacep.com.br/ws/${c}/json/`).then(r=>r.json()); if(r.erro) return toast('CEP não encontrado. Confira os números.',true);
      if(r.logradouro) $('#'+p+'Log').value=r.logradouro; if(r.bairro) $('#'+p+'Bairro').value=r.bairro; $('#'+p+'Cid').value=r.localidade||''; $('#'+p+'Uf').value=r.uf||''; $('#'+p+'Ibge').value=r.ibge||''; $('#'+p+'Num').focus(); }catch(_){} };
  $('#'+p+'Cep').onblur=busca; $('#'+p+'Cep').addEventListener('input',()=>{ if(soDig($('#'+p+'Cep').value).length===8) busca(); });
}
function lerEndereco(p, obrigatorio){
  const v=k=>$('#'+p+k).value.trim(), cep=soDig(v('Cep'));
  const algum=cep||v('Log')||v('Num')||v('Bairro');
  if(!algum){ if(obrigatorio) throw new Error('Informe o endereço (CEP).'); return {cep:null,logradouro:null,numero:null,complemento:null,bairro:null,cidade:null,uf:null,cod_ibge:null}; }
  if(cep.length!==8) throw new Error('Informe o CEP com 8 números.');
  const e={cep, logradouro:v('Log'), numero:v('Num'), complemento:v('Comp')||null, bairro:v('Bairro'), cidade:v('Cid'), uf:v('Uf').toUpperCase(), cod_ibge:soDig(v('Ibge'))||null};
  if(!e.logradouro||!e.numero||!e.bairro||!e.cidade||e.uf.length!==2) throw new Error('Preencha o endereço completo: rua, número, bairro, cidade e UF (use "SN" se não houver número).');
  if(!e.cod_ibge) throw new Error('Não identifiquei o município pelo CEP. Saia do campo CEP para buscar de novo.');
  return e;
}

  $('#fvForm').onsubmit=e=>{ e.preventDefault(); busy($('#fvBtn'),async()=>{
    const cpf=soDig($('#fvCpf').value);
    if(!(cpfValido(cpf)||cnpjValido(cpf))) throw new Error('CPF inválido. Confira os números.');

      if(!row.banco||!row.agencia||!row.conta) throw new Error('Preencha banco, agência e conta.'); }
    let res;
    if(id) res = await sb.from('prem_favorecidos').update(row).eq('id',id).select().single();
    else { row.cliente_id=clienteId; res = await sb.from('prem_favorecidos').insert(row).select().single(); }
    if(res.error) throw new Error(res.error.code==='23505'?'Já existe um favorecido com esse CPF.':res.error.message);
    await sb.rpc('prem_atualizar_endereco_itens',{p_favorecido:res.data.id});
    fecharModal(); toast('Favorecido salvo.'); await carregar(); onSaved && onSaved(res.data);
  });};

// ================= CAMPANHAS =================
const CST = { em_analise:['Em análise','st-enviada'], ajustes:['Ajustes solicitados','st-cancelada'], aprovada:['Aprovada','st-concluida'], reprovada:['Reprovada','st-cancelada'], cancelada:['Cancelada','st-cancelada'] };
const hoje = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const dataDe = s => new Date(s+'T00:00:00');
const diasAte = s => Math.round((dataDe(s)-hoje())/86400000);
function campsValidas(cli){ const pz=Number(S.prazoPos??30);
  return S.camps.filter(c=>c.cliente_id===cli && c.status==='aprovada' && diasAte(c.periodo_inicio)<=0 && diasAte(c.periodo_fim)>=-pz); }
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function fimMax(ini){ const d=dataDe(ini); d.setMonth(d.getMonth()+(S.durMax||3)); d.setDate(d.getDate()-1); return isoD(d); }
function podeRenovar(c){ if(c.status!=='aprovada' || S.camps.some(x=>x.renovada_de===c.id)) return false;
  const d=diasAte(c.periodo_fim); return d<=(S.avisoRen??15) && d>=-(S.prazoPos??30); }
function periodoRenov(c){ const d=dataDe(c.periodo_fim); d.setDate(d.getDate()+1); const ini=isoD(d); return [ini, fimMax(ini)]; }
function renovarCampanha(id){
  const c=S.camps.find(x=>x.id===id); const [ini,fim]=periodoRenov(c);
  abrirModal(`<h1>Repetir a campanha "${esc(c.nome)}"?</h1>
    <p>Vamos criar a mesma campanha, com o mesmo briefing e regulamento, para o próximo período:</p>
    <div class="calc"><div>Novo período<b>${dIso(ini)} a ${dIso(fim)}</b></div><div>Duração<b>${S.durMax||3} meses</b></div></div>
    <p class="muted small">A repetição já nasce aprovada. Se quiser mudar participantes, metas ou critérios, cadastre uma campanha nova em vez de repetir.</p>
    <button class="btn pri" id="rnOk">Sim, repetir por mais ${S.durMax||3} meses</button> <button class="btn" onclick="fecharModal()">Agora não</button>`);
  $('#rnOk').onclick=()=>busy($('#rnOk'),async()=>{ const {error}=await sb.rpc('prem_renovar_campanha',{p_campanha:id}); if(error) throw error;
    fecharModal(); toast('Campanha repetida até '+dIso(fim)+'.'); await carregar(); ir(S.tab); });
}
function campSituacao(c){
  if(c.status!=='aprovada') return `<span class="pill ${CST[c.status][1]}">${CST[c.status][0]}</span>`;
  const pz=Number(S.prazoPos??30);
  if(diasAte(c.periodo_inicio)>0) return `<span class="pill st-nota_emitida">Aprovada · começa ${dIso(c.periodo_inicio)}</span>`;
  if(diasAte(c.periodo_fim)>=0) return `<span class="pill st-concluida">Em andamento</span>`;
  if(diasAte(c.periodo_fim)>=-pz) return `<span class="pill st-pago_cliente">Encerrada · ordens até ${new Date(dataDe(c.periodo_fim).getTime()+pz*86400000).toLocaleDateString('pt-BR')}</span>`;
  return `<span class="pill st-cancelada">Encerrada</span>`;
}
const ehTerceiros = modelo => !!modelo && !String(modelo).startsWith('colab_');
function regulamento(emp, terceiros){
  emp = emp || 'A empresa';
  return [`Ao participar, o ${terceiros?'participante':'colaborador'} declara conhecer e concordar com todas as regras desta campanha.`,
    `${emp} poderá ajustar objetivos e critérios quando necessário, comunicando antes todos os participantes.`,
    terceiros
      ? `Os participantes não são empregados de ${emp}. Os prêmios têm natureza de incentivo por resultado, não criam vínculo de emprego, e a tributação aplicável a eles é de responsabilidade de ${emp}.`
      : `Os prêmios têm natureza de incentivo e reconhecimento por desempenho superior ao ordinariamente esperado, não integram a remuneração e não se incorporam ao salário, nos termos do art. 457, §§ 2º e 4º, da CLT (redação da Lei nº 13.467/2017).`,
    `Situações não previstas neste briefing serão decididas pela diretoria de ${emp}.`];
}
function desenharCamp(){
  const box=$('#nCampBox'); if(!box) return;
  const admin=S.papel==='admin', cli=cliNova(), lista=cli?campsValidas(cli):[];
  if(!cli){ box.innerHTML='<p class="muted" style="margin:0">Selecione o cliente.</p>'; return; }
  if(!lista.length){
    box.innerHTML = `<div class="msg err" style="margin:0">Não há campanha aprovada e vigente${admin?' para este cliente':''}. Sem campanha não é possível enviar ordens.
      ${admin?'':' <button type="button" class="link" onclick="formCampanha()">Preencher briefing da campanha</button>'}</div>`;
    $('#nBtn') && ($('#nBtn').disabled=true); return; }
  $('#nBtn') && ($('#nBtn').disabled=false);
  box.innerHTML = `<select id="nCamp" required>${lista.length>1?'<option value="">Escolha a campanha…</option>':''}${lista.map(c=>`<option value="${c.id}">${esc(c.nome)} · ${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</option>`).join('')}</select>`;
}
function vCampanhas(){
  const admin=S.papel==='admin';

  $('#main').innerHTML = `

      ${nArqC||S.verArqC?`<button class="btn" id="cpVerArq">${S.verArqC?'Voltar às ativas':'Arquivadas ('+nArqC+')'}</button>`:''}
      <button class="btn pri" onclick="formCampanha()">+ Nova campanha</button></div>
    <p class="muted" style="margin-top:-6px">Toda ordem de pagamento precisa estar ligada a uma campanha aprovada. Duração máxima: ${S.durMax||3} meses; ordens aceitas até ${S.prazoPos??30} dias após o fim.</p>
    <div class="card">${lista.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Nº</th>${admin?'<th>Cliente</th>':''}<th>Campanha</th><th>Período</th><th class="num">Orçamento</th><th class="num">Pago</th><th>Situação</th></tr></thead><tbody>
      ${lista.map(c=>`<tr class="click" data-camp="${c.id}"><td>#${c.numero}</td>${admin?`<td>${esc(c.prem_clientes?.nome)}</td>`:''}<td><b>${esc(c.nome)}</b>${c.renovada_de?` <span class="muted small">· repetição de #${S.camps.find(x=>x.id===c.renovada_de)?.numero??''}</span>`:''}${podeRenovar(c)?' <span class="pill st-enviada">Terminando</span>':''}<div class="muted small">${esc(c.participantes).slice(0,80)}</div></td>
        <td>${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</td><td class="num">${c.orcamento_previsto?brl(c.orcamento_previsto):'—'}</td><td class="num">${brl(pagoPor(c.id))}</td><td>${campSituacao(c)}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty">${f?'Nenhuma campanha com esse status.':'Nenhuma campanha cadastrada ainda.'}</div>`}</div>`;
  $('#cpF').value=f; $('#cpF').onchange=e=>{ S.campFiltro=e.target.value; vCampanhas(); };
  $('#cpVerArq') && ($('#cpVerArq').onclick=()=>{ S.verArqC=!S.verArqC; S.campFiltro=''; vCampanhas(); });
  document.querySelectorAll('[data-camp]').forEach(tr=>tr.onclick=()=>detalheCampanha(tr.dataset.camp));
}
function detalheCampanha(id){

    ${admin && c.status==='aprovada' ? `<div style="margin-top:16px"><button class="btn sm" data-st="ajustes">Reabrir para ajustes</button></div>`:''}

    ${!admin && ['em_analise','ajustes'].includes(c.status) ? `<div style="margin-top:16px"><button class="btn" id="cpEd">Editar briefing</button></div>`:''}

function mdHtml(t){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out='', inList=false;
  for(const raw of String(t||'').split('\n')){
    const l=raw.trimEnd();
    const li=l.match(/^\d+\.\s+(.*)$/);
    if(li){ if(!inList){ out+='<ol>'; inList=true; } out+=`<li>${inl(li[1])}</li>`; continue; }
    if(inList){ out+='</ol>'; inList=false; }
    if(!l) continue;
    if(l.startsWith('## ')) out+=`<h3>${inl(l.slice(3))}</h3>`;
    else if(l.startsWith('# ')) out+=`<h2 style="text-align:center">${inl(l.slice(2))}</h2>`;
    else out+=`<p>${inl(l)}</p>`;
  }
  if(inList) out+='</ol>';
  return out;
}

    <div class="card"><h2>Situação dos clientes</h2>
      <p class="muted small" style="margin-top:0">${pend.length} cliente(s) ativo(s) sem contrato assinado.</p>
      <table class="tbl"><tbody>${S.clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td>${c.contrato_aceito_em?`<span class="pill st-concluida">Assinado ${dt(c.contrato_aceito_em)}</span>`:'<span class="pill st-enviada">Pendente</span>'}</td>
        <td class="num">${c.contrato_aceito_em?`<button class="btn sm" data-ver="${c.id}">Ver</button>`:''}</td></tr>`).join('')}</tbody></table>
      <button class="btn sm" id="cfPrev" style="margin-top:12px">Pré-visualizar modelo</button></div></div>
    <div class="card" style="margin-top:16px"><h2>NFS-e automática (API da Receita)</h2>
      <div id="nfCertInfo" class="small" style="margin-bottom:10px">${cfg.nfse_cert_info?`Certificado: <b>${esc(cfg.nfse_cert_info.titular||'')}</b> · válido até <b>${dIso((cfg.nfse_cert_info.validade||'').slice(0,10))}</b>${new Date(cfg.nfse_cert_info.validade)<new Date(Date.now()+30*864e5)?' <span class="pill st-cancelada">vence em breve</span>':''}`:(cfg.nfse_cert_path?'Certificado enviado.':'<span class="pill st-enviada">Nenhum certificado enviado</span>')}</div>

      <button class="btn pri sm" id="nfSalvar">Salvar configuração da NFS-e</button></div>`;
  ligarOlhos($('#main'));
  $('#nfAmb') && ($('#nfAmb').value=String(cfg.nfse_ambiente||2));
  const conferirCert=async()=>{ const {data,error}=await sb.functions.invoke('prem-nfse',{body:{acao:'info'}});
    if(error){ let m=error.message; try{ m=(await error.context.json()).error||m; }catch(_){} throw new Error(m); }
    $('#nfCertInfo').innerHTML=`Certificado: <b>${esc(data.titular)}</b> · CNPJ ${esc(fmtDoc(data.cnpj||''))} · válido até <b>${dIso(data.validade.slice(0,10))}</b> · emissor ${esc(data.emissor)}`;
    if(data.cnpj && soDig(cfg.contratada_cnpj||'') && data.cnpj!==soDig(cfg.contratada_cnpj)) toast('Atenção: o CNPJ do certificado é diferente do CNPJ da empresa cadastrado.',true);
    return data; };
  $('#nfCertBtn').onclick=()=>busy($('#nfCertBtn'),async()=>{
    const f=$('#nfPfx').files[0], senha=$('#nfSenha').value;
    if(!f) throw new Error('Escolha o arquivo .pfx do certificado.'); if(!senha) throw new Error('Digite a senha do certificado.');
    const path=`a1-${Date.now()}.pfx`;
    const up=await sb.storage.from('nfse-cert').upload(path,f,{upsert:false,contentType:'application/x-pkcs12'}); if(up.error) throw up.error;
    const r1=await sb.rpc('prem_nfse_salvar_senha',{p_senha:senha}); if(r1.error) throw r1.error;
    const r2=await sb.from('prem_config').update({nfse_cert_path:path}).eq('id',true); if(r2.error) throw r2.error;
    $('#nfSenha').value=''; $('#nfPfx').value='';
    const d=await conferirCert(); toast(`Certificado ok: ${d.titular}, válido até ${dIso(d.validade.slice(0,10))}.`); });
  $('#nfCertTeste') && ($('#nfCertTeste').onclick=()=>busy($('#nfCertTeste'),async()=>{ const d=await conferirCert(); toast('Certificado lido com sucesso.'); }));
  $('#nfSalvar').onclick=()=>busy($('#nfSalvar'),async()=>{
    const amb=Number($('#nfAmb').value), aliq=parseValor($('#nfAliq').value), serie=soDig($('#nfSerie').value)||'1';
    if(!(aliq>=0&&aliq<100)) throw new Error('Alíquota inválida.');
    const {error}=await sb.from('prem_config').update({nfse_ambiente:amb,nfse_aliq_sn:aliq,nfse_serie:serie}).eq('id',true); if(error) throw error;
    toast(amb===1?'Configuração salva: as próximas notas serão REAIS.':'Configuração salva: ambiente de homologação (teste).'); });
  $('#cfSave').onclick=()=>busy($('#cfSave'),async()=>{
    const row={contratada_razao:$('#cfRaz').value.trim()||null, contratada_cnpj:$('#cfCnpj').value.trim()||null, contratada_endereco:$('#cfEnd').value.trim()||null,

      contratada_pix:$('#cfPix').value.trim()||null};
    if('cobranca_automatica' in cfg) row.cobranca_automatica=$('#cfAuto').checked;
    if('contratada_cidade' in cfg){ row.contratada_cidade=$('#cfCid').value.trim()||null; row.texto_repasse=$('#cfTxt').value.trim()||null; }
    if(row.contrato_exigir && (!row.contratada_razao||!row.contratada_cnpj||!row.contratada_endereco||!row.contratada_rep||!row.contrato_foro))
      throw new Error('Preencha todos os dados da empresa antes de exigir a assinatura.');
    const {error}=await sb.from('prem_config').update(row).eq('id',true); if(error) throw error; S.cfgNota=null; toast('Configuração salva.'); });
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verContratoAssinado(b.dataset.ver));
  $('#cfPrev').onclick=()=>busy($('#cfPrev'),async()=>{
    const cli=S.clientes[0]; if(!cli) throw new Error('Cadastre um cliente para pré-visualizar.');
    const {data,error}=await sb.rpc('prem_contrato_render',{p_cliente:cli.id,p_rep_nome:null,p_rep_cpf:null,p_endereco:null}); if(error) throw error;
    abrirModal(`<h1>Pré-visualização (com dados de ${esc(cli.nome)})</h1><div style="${CSS_CONTRATO};max-height:65vh">${mdHtml(data.texto)}</div>`); });
}

function vAjuda(){

  const video=(src,titulo)=>`<div class="card" style="margin-bottom:16px"><h2>${titulo}</h2><video src="${src}" controls preload="metadata" style="width:100%;border-radius:10px;background:#000"></video></div>`;
  $('#main').innerHTML = `

    <p class="muted" style="margin-top:-6px">Assista ao vídeo de cada parte do sistema ou siga o passo a passo.</p>
    ${admin?`<div class="toolbar"><button class="btn sm ${S.ajudaVer!=='cliente'?'pri':''}" onclick="S.ajudaVer='admin';vAjuda()">Manual do administrador</button><button class="btn sm ${S.ajudaVer==='cliente'?'pri':''}" onclick="S.ajudaVer='cliente';vAjuda()">Manual do cliente</button></div>`:''}
    ${admin && S.ajudaVer!=='cliente'
      ? video('videos/manual-admin.mp4','Vídeo: como usar o sistema (administrador)') + bloco(MANUAL_ADMIN)
      : video('videos/manual-cliente.mp4','Vídeo: como usar o sistema (cliente)') + bloco(MANUAL_CLIENTE)}
    <div class="card" style="margin-top:6px"><h2>📱 Instalar no celular</h2><p class="muted" style="margin-top:0">Coloque o ícone da Mayway na tela inicial do seu celular, como um aplicativo.</p><button class="btn" onclick="abrirModal(instrucoesInstalar())">Ver como instalar (iPhone e Android)</button></div>
    <p class="muted small">Ainda com dúvida? Fale com a nossa equipe.</p>`;
}

// Consulta pública de CNPJ (BrasilAPI; se falhar, publica.cnpj.ws)
const titulo = t => (t||'').toLowerCase().replace(/(^|[\s\/(-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Da|Do|Das|Dos|E)\b/g,m=>m.toLowerCase()).trim();
async function consultarCnpj(cnpj){
  const ok=r=>{ if(!r.ok) throw new Error(r.status===404?'nao_encontrado':'falha'); return r.json(); };
  try{
    const d=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj).then(ok);
    return {razao:d.razao_social, fantasia:d.nome_fantasia, situacao:d.descricao_situacao_cadastral, cep:soDig(d.cep||''),
      logradouro:[d.descricao_tipo_de_logradouro, d.logradouro].filter(Boolean).join(' '), numero:d.numero, complemento:d.complemento, bairro:d.bairro,
      cidade:d.municipio, uf:d.uf, ibge:d.codigo_municipio_ibge?String(d.codigo_municipio_ibge):'', telefone:d.ddd_telefone_1||'', email:d.email||''};
  }catch(e){
    if(e.message==='nao_encontrado') throw new Error('CNPJ não encontrado na Receita.');
    const d=await fetch('https://publica.cnpj.ws/cnpj/'+cnpj).then(ok).catch(()=>{ throw new Error('Não consegui consultar o CNPJ agora. Tente de novo em 1 minuto ou preencha à mão.'); });
    const e2=d.estabelecimento||{};
    return {razao:d.razao_social, fantasia:e2.nome_fantasia, situacao:e2.situacao_cadastral, cep:soDig(e2.cep||''),
      logradouro:[e2.tipo_logradouro, e2.logradouro].filter(Boolean).join(' '), numero:e2.numero, complemento:e2.complemento, bairro:e2.bairro,
      cidade:e2.cidade?.nome, uf:e2.estado?.sigla, ibge:e2.cidade?.ibge_id?String(e2.cidade.ibge_id):'', telefone:(e2.ddd1||'')+(e2.telefone1||''), email:e2.email||''};
  }
}
const fmtTel = t => { const d=soDig(t); return d.length===10?d.replace(/(\d{2})(\d{4})(\d{4})/,'($1) $2-$3'):d.length===11?d.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3'):t; };
async function preencherPorCnpj(p, campos){
