  const aPagar=com.filter(c=>c.status==='a_pagar'), doMes=com.filter(c=>c.competencia.slice(0,7)===sel);
  const nomeInd=id=>(inds.find(i=>i.id===id)||{}).nome||'—', nomeCli=id=>(S.clientes.find(c=>c.id===id)||{}).nome||'—';
  const porInd={}; doMes.forEach(c=>{ const p=porInd[c.indicador_id]=porInd[c.indicador_id]||{aPagar:0,pago:0,perdido:0,n:0}; p.n++; p[c.status==='a_pagar'?'aPagar':c.status==='paga'?'pago':'perdido']+=Number(c.valor); });
  const ano=new Date().getFullYear()+'';
  $('#main').innerHTML=`
    <div class="toolbar"><h1 style="margin:0">Indicadores</h1><div class="spacer"></div><button class="btn pri" onclick="formIndicador()">+ Novo indicador</button></div>
    <div class="grid kpis">
      <div class="card kpi"><div class="l">Comissões a pagar (total)</div><div class="v">${brl(soma(aPagar))}</div><div class="s">${aPagar.length} ordens</div></div>
      <div class="card kpi"><div class="l">A pagar de meses fechados</div><div class="v">${brl(soma(aPagar.filter(c=>c.competencia.slice(0,7)<atual)))}</div><div class="s">antes de ${nomeMesK(atual)}</div></div>
      <div class="card kpi"><div class="l">Pagas em ${ano}</div><div class="v">${brl(soma(com.filter(c=>c.status==='paga'&&(c.pago_em||'').startsWith(ano))))}</div></div>
      <div class="card kpi"><div class="l">Indicadores recebendo</div><div class="v">${inds.filter(i=>situacaoIndicador(i).cls==='st-concluida').length} de ${inds.filter(i=>i.ativo).length}</div></div>
    </div>
    <div class="card"><div class="toolbar" style="margin:0 0 10px"><h2 style="margin:0">Fechamento do mês</h2><div class="spacer"></div>
      <select id="iMes">${[...new Set([sel,...meses])].map(k=>`<option value="${k}">${nomeMesK(k)}</option>`).join('')}</select>
      ${doMes.length?'<button class="btn sm" id="iCsv">Baixar CSV</button>':''}</div>
      ${Object.keys(porInd).length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Indicador</th><th>PIX</th><th class="num">Ordens</th><th class="num">A pagar</th><th class="num">Pago</th><th class="num">Sem direito</th><th></th></tr></thead><tbody>
      ${Object.entries(porInd).map(([id,p])=>{ const i=inds.find(x=>x.id===id)||{}; return `<tr><td><b>${esc(i.nome||'—')}</b></td><td class="small">${i.pix_chave?esc((i.pix_tipo?i.pix_tipo+': ':'')+i.pix_chave):'<span class="muted">sem PIX</span>'}</td><td class="num">${p.n}</td><td class="num"><b>${brl(p.aPagar)}</b></td><td class="num">${brl(p.pago)}</td><td class="num muted">${brl(p.perdido)}</td>
        <td>${p.aPagar>0?`<button class="btn sm pri" data-pagar="${id}">Registrar pagamento</button>`:''}</td></tr>`; }).join('')}</tbody></table></div>`
      :`<div class="empty">Nenhuma comissão em ${nomeMesK(sel)}. As comissões aparecem aqui quando um cliente com indicador paga uma ordem.</div>`}
    </div>
    <div class="card"><h2>Indicadores</h2>${inds.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Indicador</th><th class="num">Comissão padrão</th><th class="num">Clientes</th><th>Situação</th><th class="num">A pagar</th></tr></thead><tbody>
      ${inds.map(i=>{ const s=situacaoIndicador(i); return `<tr class="click" data-ind="${i.id}"><td><b>${esc(i.nome)}</b><div class="muted small">${esc(fmtDoc(i.documento||''))}${i.telefone?' · '+esc(i.telefone):''}</div></td><td class="num">${pct(i.percentual_padrao)}</td><td class="num">${s.clis.length}</td>
        <td><span class="pill ${s.cls}">${esc(s.txt)}</span>${s.ult?`<div class="muted small">Último cliente ativado em ${dt(s.ult)}</div>`:''}</td><td class="num">${brl(soma(aPagar.filter(c=>c.indicador_id===i.id)))}</td></tr>`; }).join('')}
      </tbody></table></div>`:`<div class="empty">Cadastre um indicador e depois escolha ele no cadastro dos clientes que ele trouxe.</div>`}
      <p class="small muted" style="margin:12px 0 0">Regra: a comissão é calculada sobre o <b>total que o cliente paga</b> (premiações + taxa + TED) e nasce quando o cliente paga a ordem. O indicador só recebe se tiver ativado um <b>cliente novo</b> (primeira ordem paga) nos 3 meses anteriores ao pagamento; ao ativar um novo, volta a receber de toda a carteira dali em diante. O período parado não é pago depois.</p>
    </div>`;
  $('#iMes').value=sel; $('#iMes').onchange=e=>{ S.indMes=e.target.value; vIndicadores(); };
  document.querySelectorAll('[data-ind]').forEach(tr=>tr.onclick=()=>formIndicador(tr.dataset.ind));
  document.querySelectorAll('[data-pagar]').forEach(b=>b.onclick=()=>registrarPagtoComissao(b.dataset.pagar, sel));
  $('#iCsv') && ($('#iCsv').onclick=()=>{
    const ord=id=>(S.ordens.find(o=>o.id===id)||{}).numero||'';
    const st={a_pagar:'A pagar',paga:'Paga',sem_direito:'Sem direito'};
    const linhas=[['Indicador','Cliente','Ordem','Pago pelo cliente em','Total pago pelo cliente','%','Comissão','Situação','Motivo','Pago ao indicador em','NF do indicador','CNPJ do indicador']].concat(doMes.map(c=>[nomeInd(c.indicador_id),nomeCli(c.cliente_id),ord(c.ordem_id),dt(c.pago_cliente_em),String(c.base).replace('.',','),String(c.percentual).replace('.',','),String(c.valor).replace('.',','),st[c.status],c.motivo||'',c.pago_em?dIso(c.pago_em):'',c.nf_numero||'',(inds.find(x=>x.id===c.indicador_id)||{}).documento||'']));
    const b=new Blob(['﻿'+linhas.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`comissoes-${sel}.csv`; a.click(); });
}
function formIndicador(id){
  const i=(S.inds||[]).find(x=>x.id===id)||{ativo:true, percentual_padrao:0};
  const s=id?situacaoIndicador(i):null, com=(S.comis||[]).filter(c=>c.indicador_id===id);
  const st={a_pagar:['A pagar','st-pago_cliente'],paga:['Paga','st-concluida'],sem_direito:['Sem direito','st-cancelada']};
  const ord=oid=>(S.ordens.find(o=>o.id===oid)||{}).numero||'—', nomeCli=cid=>(S.clientes.find(c=>c.id===cid)||{}).nome||'—';
  abrirModal(`<h1>${id?esc(i.nome):'Novo indicador'}</h1>
    ${s?`<p style="margin-top:0"><span class="pill ${s.cls}">${esc(s.txt)}</span></p>`:''}
    <form id="iForm">
      <div class="row"><div class="f"><label>Nome completo ou razão social</label><input id="iNome" required value="${esc(i.nome||'')}"></div>
      <div class="f"><label>CPF (pessoa física) ou CNPJ (empresa)</label><input id="iDoc" required inputmode="numeric" value="${esc(fmtDoc(i.documento||''))}"><div class="small muted" id="iDocTipo" style="margin-top:4px"></div></div></div>
      <div class="row"><div class="f"><label>Telefone</label><input id="iTel" value="${esc(i.telefone||'')}"></div>
      <div class="f"><label>E-mail</label><input id="iEmail" type="email" value="${esc(i.email||'')}"></div></div>
      <div class="row"><div class="f"><label>Tipo da chave PIX</label><select id="iPixT">${['','CPF','CNPJ','E-mail','Telefone','Aleatória'].map(t=>`<option ${t===(i.pix_tipo||'')?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="f"><label>Chave PIX</label><input id="iPix" value="${esc(i.pix_chave||'')}"></div></div>
      <div class="row"><div class="f"><label>Comissão padrão (% do total que o cliente paga)</label><input id="iPct" required inputmode="decimal" value="${String(i.percentual_padrao).replace('.',',')}"></div>
      <div class="f"><label>&nbsp;</label><label><input type="checkbox" id="iAtivo" style="width:auto" ${i.ativo?'checked':''}> Indicador ativo</label></div></div>
      <div class="f"><label>Observações</label><textarea id="iObs" rows="2">${esc(i.observacao||'')}</textarea></div>
      <p class="small muted">O percentual vale para os próximos pagamentos. Para um cliente com percentual diferente, ajuste no cadastro do cliente.</p>
      <button class="btn pri" id="iBtn">Salvar</button> ${id&&!com.length?'<button type="button" class="btn" id="iExc">Excluir</button>':''}
    </form>
    ${id?`<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"><b>Carteira (${s.clis.length})</b>
      ${s.clis.length?`<table class="tbl" style="margin-top:6px"><thead><tr><th>Cliente</th><th class="num">Comissão</th><th>1ª ordem paga</th></tr></thead><tbody>${s.clis.map(c=>`<tr><td>${esc(c.nome)}</td><td class="num">${pct(c.comissao_percentual!=null?c.comissao_percentual:i.percentual_padrao)}${c.comissao_percentual!=null?' <span class="muted small">(específica)</span>':''}</td><td>${primeiroPagoCliente(c.id)?dt(primeiroPagoCliente(c.id)):'<span class="muted">ainda não pagou</span>'}</td></tr>`).join('')}</tbody></table>`:'<p class="small muted">Nenhum cliente ainda. Escolha este indicador no cadastro do cliente (Clientes → editar).</p>'}</div>
    <div style="margin-top:14px"><b>Comissões</b>${com.length?`<div class="tblwrap"><table class="tbl" style="margin-top:6px"><thead><tr><th>Pagamento do cliente</th><th>Cliente · ordem</th><th class="num">Base</th><th class="num">Comissão</th><th>Situação</th></tr></thead><tbody>
      ${com.map(c=>`<tr><td>${dt(c.pago_cliente_em)}</td><td>${esc(nomeCli(c.cliente_id))} · #${ord(c.ordem_id)}</td><td class="num">${brl(c.base)} × ${pct(c.percentual)}</td><td class="num"><b>${brl(c.valor)}</b></td>
        <td><span class="pill ${st[c.status][1]}">${st[c.status][0]}</span>${c.status==='paga'?`<div class="small muted">em ${dIso(c.pago_em)}${c.nf_numero?' · NF '+esc(c.nf_numero):''}${c.nf_arquivo?` · <a href="#" data-file="${esc(c.nf_arquivo)}">nota</a>`:''}${c.comprovante?` · <a href="#" data-file="${esc(c.comprovante)}">comprovante</a>`:''}</div>`:c.motivo?`<div class="small muted">${esc(c.motivo)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Nenhuma comissão ainda.</p>'}</div>`:''}`);
  document.querySelectorAll('#modalBody [data-file]').forEach(a=>a.onclick=e=>{e.preventDefault(); abrirArquivo(a.dataset.file);});
  const tipoInd=()=>{ const d=soDig($('#iDoc').value); $('#iDocTipo').textContent=d.length===11?(cpfValido(d)?'Pessoa física: paga direto no PIX, sem nota':'CPF inválido'):d.length===14?(cnpjValido(d)?'Empresa: pagamento contra nota fiscal do indicador':'CNPJ inválido'):'';};
  $('#iDoc').oninput=tipoInd; $('#iDoc').onblur=()=>{ const d=soDig($('#iDoc').value); if(d.length===11||d.length===14) $('#iDoc').value=fmtDoc(d); }; tipoInd();
  $('#iExc') && ($('#iExc').onclick=()=>busy($('#iExc'),async()=>{ if(!confirm('Excluir este indicador? Os clientes dele ficam sem indicador.')) return; const {error}=await sb.from('prem_indicadores').delete().eq('id',id); if(error) throw error; fecharModal(); toast('Indicador excluído.'); recarregar(); }));
  $('#iForm').onsubmit=e=>{e.preventDefault(); busy($('#iBtn'),async()=>{
    const doc=soDig($('#iDoc').value);
    if(!(doc.length===11?cpfValido(doc):doc.length===14?cnpjValido(doc):false)) throw new Error('Informe um CPF ou CNPJ válido.');
    const p=parseValor($('#iPct').value); if(!(p>=0&&p<=100)) throw new Error('Comissão deve ficar entre 0 e 100%.');
    const row={nome:$('#iNome').value.trim(), documento:doc?fmtDoc(doc):null, telefone:$('#iTel').value.trim()||null, email:$('#iEmail').value.trim().toLowerCase()||null,
      pix_tipo:$('#iPixT').value||null, pix_chave:$('#iPix').value.trim()||null, percentual_padrao:p, ativo:$('#iAtivo').checked, observacao:$('#iObs').value.trim()||null};
    const {error}= id ? await sb.from('prem_indicadores').update(row).eq('id',id) : await sb.from('prem_indicadores').insert(row);
    if(error) throw error; fecharModal(); toast('Indicador salvo.'); recarregar();
  });};
}
function registrarPagtoComissao(indId, mes){
  const i=(S.inds||[]).find(x=>x.id===indId)||{};
  const pf=soDig(i.documento||'').length===11;
  const lista=(S.comis||[]).filter(c=>c.indicador_id===indId && c.status==='a_pagar' && c.competencia.slice(0,7)===mes);
  const total=Math.round(lista.reduce((t,c)=>t+Number(c.valor),0)*100)/100;
  abrirModal(`<h1>Pagamento de comissão</h1>
    <p style="margin-top:0"><b>${esc(i.nome||'')}</b> · ${pf?'Pessoa física':'Pessoa jurídica (nota fiscal)'} · ${nomeMesK(mes)} · ${lista.length} ordem(ns)</p>
    <div class="card" style="background:#fafbfc"><div class="muted small">Comissão a pagar</div><div style="font-size:22px;font-weight:600">${brl(total)}</div>
      <div class="small" style="margin-top:6px">${i.pix_chave?`PIX ${esc(i.pix_tipo||'')}: <b>${esc(i.pix_chave)}</b>`:'<span class="muted">Indicador sem chave PIX cadastrada</span>'}</div></div>
    ${pf?'':`<p class="small" style="margin:12px 0 8px">O indicador emite a nota fiscal da comissão contra a Mayway, no valor de <b>${brl(total)}</b>.</p>
      <div class="row"><div class="f"><label>Número da NF do indicador</label><input id="pcNfN"></div>
      <div class="f"><label>Arquivo da NF (PDF ou XML)</label><input id="pcNf" type="file" accept="application/pdf,.xml,text/xml,image/*"></div></div>`}
    <div class="row"><div class="f"><label>Data do pagamento</label><input id="pcData" type="date" value="${new Date().toLocaleDateString('sv-SE')}"></div>
    <div class="f"><label>Comprovante do PIX (opcional)</label><input id="pcArq" type="file" accept="image/*,application/pdf"></div></div>
    <button class="btn pri" id="pcOk">Confirmar pagamento</button> <button class="btn" onclick="fecharModal()">Cancelar</button>`);
  $('#pcOk').onclick=()=>busy($('#pcOk'),async()=>{
    const data=$('#pcData').value; if(!data) throw new Error('Informe a data do pagamento.');
    let nfNum=null, nfArq=null;
    if(!pf){
      nfNum=$('#pcNfN').value.trim(); const nfF=$('#pcNf').files[0];
      if(!nfNum) throw new Error('Informe o número da nota fiscal do indicador.');
      if(!nfF) throw new Error('Anexe o arquivo da nota fiscal do indicador.');
      nfArq=await upload('indicadores', indId, 'nf-comissao-'+mes, nfF);
    }
    const comp=await upload('indicadores', indId, 'comissao-'+mes, $('#pcArq').files[0]);
    const {error}=await sb.from('prem_comissoes').update({status:'paga', pago_em:data, comprovante:comp, nf_numero:nfNum, nf_arquivo:nfArq}).in('id', lista.map(c=>c.id)).eq('status','a_pagar');
    if(error) throw error; fecharModal(); toast('Pagamento registrado.'); recarregar();
  });
}

// ================= ADMIN: FATURAMENTO =================
function vFaturamento(){
  const conc=S.ordens.filter(o=>o.status==='concluida');
  const porMes={}; conc.forEach(o=>{ const d=new Date(o.concluida_em), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    porMes[k]=porMes[k]||{n:0,vol:0,fat:0}; porMes[k].n++; porMes[k].vol+=Number(o.valor_pagamento); porMes[k].fat+=Number(o.valor_taxa); });
  const meses=Object.keys(porMes).sort().reverse();
  const sel = S.fatMes || meses[0] || '';
  const doMes = conc.filter(o=>{const d=new Date(o.concluida_em);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===sel;});
  const porCli={}; doMes.forEach(o=>{const k=o.prem_clientes?.nome||'—'; porCli[k]=porCli[k]||{n:0,vol:0,fat:0}; porCli[k].n++; porCli[k].vol+=Number(o.valor_pagamento); porCli[k].fat+=Number(o.valor_taxa);});
  const nomeMes=k=>{ if(!k) return ''; const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); };
  const csv = () => { const linhas=[['Nº','Concluída em','Cliente','Descrição','Favorecido','Pagamento','Taxa %','Taxa R$','Nota R$','NF']]
      .concat(doMes.map(o=>[o.numero,dt(o.concluida_em),o.prem_clientes?.nome,o.descricao,o.favorecido_nome,o.valor_pagamento,o.taxa_percentual,o.valor_taxa,o.valor_nota,o.numero_nota||'']));
    return linhas.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'); };
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Faturamento</h1><div class="spacer"></div>
      ${meses.length?`<select id="fMes">${meses.map(k=>`<option value="${k}">${nomeMes(k)}</option>`).join('')}</select><button class="btn sm" id="fCsv">Baixar CSV do mês</button>`:''}</div>
    ${!meses.length?`<div class="card empty">O faturamento aparece aqui assim que a primeira ordem for concluída.</div>`:`
    <div class="grid kpis">
      <div class="card kpi"><div class="l">Faturamento · ${nomeMes(sel)}</div><div class="v">${brl(porMes[sel].fat)}</div></div>
      <div class="card kpi"><div class="l">Volume repassado</div><div class="v">${brl(porMes[sel].vol)}</div></div>
      <div class="card kpi"><div class="l">Ordens concluídas</div><div class="v">${porMes[sel].n}</div></div>
      <div class="card kpi"><div class="l">Taxa média efetiva</div><div class="v">${pct(porMes[sel].vol?porMes[sel].fat/porMes[sel].vol*100:0)}</div></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><h2>Por cliente · ${nomeMes(sel)}</h2><table class="tbl"><thead><tr><th>Cliente</th><th class="num">Ordens</th><th class="num">Volume</th><th class="num">Faturamento</th></tr></thead><tbody>
        ${Object.entries(porCli).sort((a,b)=>b[1].fat-a[1].fat).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${brl(v.vol)}</td><td class="num"><b>${brl(v.fat)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>Mês a mês</h2><table class="tbl"><thead><tr><th>Mês</th><th class="num">Ordens</th><th class="num">Volume</th><th class="num">Faturamento</th></tr></thead><tbody>
        ${meses.map(k=>`<tr><td>${nomeMes(k)}</td><td class="num">${porMes[k].n}</td><td class="num">${brl(porMes[k].vol)}</td><td class="num"><b>${brl(porMes[k].fat)}</b></td></tr>`).join('')}</tbody></table></div>
    </div>`}`;
  if(meses.length){
    $('#fMes').value=sel; $('#fMes').onchange=e=>{S.fatMes=e.target.value; vFaturamento();};
    $('#fCsv').onclick=()=>{ const b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`faturamento-${sel}.csv`; a.click(); };
  }
}

iniciar();
</script>
</body>
</html>
