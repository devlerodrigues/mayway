<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F3">
<meta name="description" content="Mayway Soluções – campanhas de incentivo e pagamento de premiações">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayway">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mayway Soluções · Premiações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* identidade MAY WAY (guia nov/2026) */
  --mw-porcelana:#FAF7F3; --mw-papel:#FFFCF9; --mw-areia:#F0E7DF; --mw-tinta:#263C46; --mw-vermelho:#9D2941;
  --mw-azul-mar:#3F7183; --mw-rosa:#E9ADA1; --mw-linha:#DED3CB; --mw-cinza:#6B7475;
  --bg:var(--mw-porcelana); --card:var(--mw-papel); --ink:var(--mw-tinta); --muted:#5F6869; --line:var(--mw-linha);
  --brand:var(--mw-vermelho); --brand-2:#F7E6E2; --warn:#8A4B00; --warn-bg:#F8EBD3;
  --info:#2F5E6F; --info-bg:#E2ECEF; --ok:#2F6B4F; --ok-bg:#E3EFE7; --bad:#9D2941; --bad-bg:#F7E1E3;
  --violet:#5B4A7A; --violet-bg:#ECE7F2; --r:12px;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:Lato,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
h1{font-family:var(--serif);font-weight:500;letter-spacing:-.005em}
.kpi .v{font-family:var(--serif);font-weight:600}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* layout */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{font-family:var(--serif);font-weight:600;font-size:21px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:19px;font-family:var(--serif);font-weight:500;line-height:1}
nav{display:flex;gap:4px;margin-left:12px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
nav button.on{background:var(--brand-2);color:var(--brand)}
.spacer{flex:1}
.who{color:var(--muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:27px;margin:0 0 16px;line-height:1.15}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:4px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* buttons */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
/* forms */
label{display:block;font-size:12px;font-weight:600;color:#344054;margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
.f{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.calc{background:var(--brand-2);border-radius:10px;padding:12px 14px;display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.calc div{font-size:12px;color:var(--muted)} .calc b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
/* table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select,.toolbar input{width:auto;min-width:170px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-enviada{background:var(--warn-bg);color:var(--warn)}
.st-nota_emitida{background:var(--info-bg);color:var(--info)}
.st-pago_cliente{background:var(--violet-bg);color:var(--violet)}
.st-favorecidos_pagos{background:var(--brand-2);color:var(--brand)}
.pixbox{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.pixqr{width:200px;height:200px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center}
.pixqr svg{width:100%;height:100%}
.st-concluida{background:var(--ok-bg);color:var(--ok)}
.st-cancelada{background:#f2f4f7;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:28px}
.login h1{margin-bottom:4px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:500}
/* modal */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:860px;max-height:92vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:10px;top:8px;background:#f2f4f7;border:0;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);z-index:2}
.dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin:0 0 16px}
.dl dt{color:var(--muted);font-size:13px} .dl dd{margin:0}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps div{flex:1;height:6px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--brand)}
.action{border:1px dashed var(--brand);background:#fbfdfc;border-radius:10px;padding:16px;margin-top:8px}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tl{list-style:none;padding:0;margin:0;font-size:13px}
.tl li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 16px;border-radius:10px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)}

.logo{white-space:nowrap}
nav{overflow-x:auto;scrollbar-width:none} nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:8px 10px}
.who{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* o e-mail do usuário fica dentro do menu Mais */
.who{display:none}
/* menu que se ajusta à largura */
nav{flex:1 1 auto;min-width:0;overflow:hidden}
.bar > .spacer{flex:0 0 0}
.nav-mais .car{font-size:10px;margin-left:2px}
nav .sh{display:none}
.nav-menu{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);padding:6px;min-width:220px;max-width:280px}
.nav-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;font-weight:500;color:var(--ink,#101828);cursor:pointer;font-size:14px}
.nav-menu button:hover{background:var(--bg,#f4f5f7)}
.nav-menu button.on{background:var(--brand-2);color:var(--brand)}
.nav-menu .nm-quem{padding:8px 12px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-menu .nm-sair{color:var(--bad);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
/* ===== celular ===== */
input,select,textarea{font-size:16px}
header{padding-top:env(safe-area-inset-top)}
@media(max-width:700px){
  body{font-size:15px}
  .bar{padding:10px 14px;gap:10px;flex-wrap:nowrap}
  .logo{font-size:18px}
  .who{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:#fff;border-top:1px solid var(--line);
      display:flex;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(16,24,40,.06)}
  nav button{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 4px;font-size:12px}
  nav{overflow:hidden!important}
  nav .lg{display:none} nav .sh{display:inline}
  nav .nav-mais{flex:0 0 auto;padding:10px 6px} nav .nav-mais .car{display:none}
  nav:empty{display:none}
  .nav-menu{left:8px!important;right:8px;top:auto!important;max-width:none;bottom:calc(64px + env(safe-area-inset-bottom));border-radius:14px}
  .nav-menu button{padding:13px 14px;font-size:15px}
  .btn-sair{display:none}
  main{padding:16px 12px calc(90px + env(safe-area-inset-bottom))}
  h1{font-size:24px}
  .card{padding:14px;border-radius:12px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:18px}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .toolbar{gap:8px}
  .toolbar h1{flex:1 1 100%}
  .toolbar select,.toolbar input{min-width:0;flex:1 1 100%}
  .toolbar .spacer{display:none}
  .row{grid-template-columns:1fr!important}
  .row.itemrow{grid-template-columns:1fr auto!important;gap:8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .row.itemrow > div:first-child{grid-column:1/-1}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
  .calc{gap:12px}
  .calc div{flex:1 1 40%}
  .btn{padding:11px 14px}
  /* tabelas viram cartões */
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px;background:#fff}
  .tbl td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;text-align:right}
  .tbl td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:0 0 auto;padding-top:2px}
  .tbl td[data-label=""]::before{display:none}
  .tbl td[data-label=""]{justify-content:flex-end}
  .tbl td > div{text-align:right}
  .tbl td .tdv{display:block;text-align:right;min-width:0}
  .tbl td .tdv > div{text-align:right}
  .tbl .num{text-align:right}
  /* janelas em tela cheia */
  .modal{padding:0;align-items:stretch}
  .modal .card{max-width:none;max-height:none;height:100%;border-radius:0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));padding-top:calc(18px + env(safe-area-inset-top))}
  .modal .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px}
  .login{padding:16px;align-items:start;padding-top:12vh}
  #__cap{left:10px;right:10px}
}
.sino{position:relative;padding:7px 9px;display:inline-grid;place-items:center}
.sino .badge{position:absolute;top:-6px;right:-6px;background:#d92d20;color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.notif-painel{position:fixed;top:60px;right:max(12px,calc(50vw - 578px));width:380px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,40,.18);z-index:30}
.notif-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.notif-push{margin:12px 14px;padding:12px;border-radius:10px;background:var(--brand-2);display:flex;flex-direction:column;gap:6px;font-size:13px}
.notif-item{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer;font:inherit;color:inherit}
.notif-item:hover{background:#f9fafb}
.notif-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px;background:transparent}
.notif-item.nova{background:#f6fbf9}.notif-item.nova .dot{background:var(--brand)}
.notif-item b{display:block;font-size:13.5px}.notif-item span{display:block;color:var(--muted);font-size:13px;margin-top:2px}.notif-item small{color:var(--muted);font-size:11.5px}
.notif-rodape{padding:10px 16px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.notif-painel{top:calc(56px + env(safe-area-inset-top));left:8px;right:8px;width:auto;max-height:75vh}}
.nfse-box{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-bottom:14px}
.nfse-tab td{padding:6px 4px}
.install-bar{display:none;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:16;background:#101828;color:#fff;border-radius:14px;padding:12px 14px;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.install-bar img{width:36px;height:36px;border-radius:9px}
.install-bar .btn{padding:8px 12px}
@media(min-width:701px){.install-bar{bottom:20px;left:auto;max-width:420px}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="vLogin" class="login hidden">
  <div class="card">
    <div class="logo" style="margin-bottom:18px"><i>M</i> Mayway Soluções</div>
    <h1 id="lgTitle">Entrar</h1>
    <p class="muted" id="lgSub" style="margin:0 0 18px">Acesse para enviar e acompanhar suas ordens de pagamento.</p>

    <form id="lgForm">
      <div class="f"><label>E-mail</label><input id="lgEmail" type="email" required autocomplete="email"></div>

      <button class="btn pri" style="width:100%;justify-content:center" id="lgBtn">Entrar</button>

<!-- ===== SEM VÍNCULO ===== -->

<!-- ===== APP ===== -->
<div id="vApp" class="hidden">
  <header><div class="bar">
    <div class="logo"><i>M</i> Mayway Soluções</div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn sm btn-sair" onclick="sair()">Sair</button>
  </div><div id="navMenu" class="nav-menu hidden" role="menu"></div></header>
  <main id="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card"><button class="x" onclick="fecharModal()">×</button><div id="modalBody"></div></div></div>

<script>
// ================= CELULAR: rótulos das tabelas, instalar app =================
function rotularTabelas(root){ (root||document).querySelectorAll('table.tbl').forEach(t=>{ const ths=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());
  t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(td.hasAttribute('data-label')) return; td.setAttribute('data-label', ths[i]||''); if(td.childNodes.length>1){ const w=document.createElement('div'); w.className='tdv'; while(td.firstChild) w.appendChild(td.firstChild); td.appendChild(w); } })); }); }
new MutationObserver(()=>rotularTabelas()).observe(document.body,{childList:true,subtree:true});
let promptInstalar=null;
const ehIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstalar=e; mostrarBarraInstalar(); });
function mostrarBarraInstalar(){ try{ if(standalone || localStorage.getItem('mw_inst_ok')) return; }catch(e){}
  if(!promptInstalar && !(ehIOS)) return;
  let b=document.getElementById('instBar'); if(!b){ b=document.createElement('div'); b.id='instBar'; b.className='install-bar'; document.body.appendChild(b); }
  b.innerHTML=`<img src="icons/icon-192.png" alt=""><div style="flex:1"><b>Instale o app Mayway</b><div class="small" style="opacity:.8">Ícone na tela inicial, abre como aplicativo.</div></div><button class="btn pri" id="instGo">Instalar</button><button class="btn" id="instNo" style="background:transparent;color:#fff;border-color:#475467">Agora não</button>`;
  b.style.display='flex';
  $('#instNo').onclick=()=>{ b.style.display='none'; try{ localStorage.setItem('mw_inst_ok','1'); }catch(e){} };
  $('#instGo').onclick=async()=>{ if(promptInstalar){ promptInstalar.prompt(); const r=await promptInstalar.userChoice; promptInstalar=null; b.style.display='none'; if(r.outcome==='accepted') try{ localStorage.setItem('mw_inst_ok','1'); }catch(e){} }
    else { b.style.display='none'; abrirModal(instrucoesInstalar()); } };
}
function instrucoesInstalar(){ return `<h1>Instalar o app no celular</h1>
  <h3>iPhone (Safari)</h3><ol style="line-height:1.7"><li>Abra o sistema no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b> e toque em <b>Adicionar</b>.</li></ol>
  <h3>Android (Chrome)</h3><ol style="line-height:1.7"><li>Abra o sistema no <b>Chrome</b>.</li><li>Toque no aviso <b>Instalar app</b> ou no menu <b>⋮</b> → <b>Instalar app</b> / <b>Adicionar à tela inicial</b>.</li></ol>
  <p class="muted">O ícone Mayway aparece junto dos seus aplicativos e abre o sistema em tela cheia.</p><button class="btn pri" onclick="fecharModal()">Entendi</button>`; }
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{ if(ehIOS && !standalone && window.innerWidth<=700) mostrarBarraInstalar(); }, 2500);

// ================= CONFIG =================
const SUPABASE_URL = 'https://cqfouldafqrtvjecespw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Q7oyyHqZZLSwC_Ah_UP_6A_EDaUirXy';
const BUCKET = 'premiacao';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const HST = {enviada:'Ordem enviada', nota_emitida:'Cobrança enviada', pago_cliente:'Cliente pagou a cobrança', favorecidos_pagos:'Favorecidos pagos', concluida:'NFS-e emitida · concluída', cancelada:'Cancelada'};
const ST = {
  enviada:      {l:'Enviar cobrança', c:'Aguardando cobrança', step:1},
  nota_emitida: {l:'Aguardando pagamento do cliente', c:'Pagar cobrança (PIX)', step:2},

const soDig = s => String(s||'').replace(/\D/g,'');
const fmtDoc = s => { s=soDig(s); return s.length===11 ? s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : s.length===14 ? s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5') : s; };
function cpfValido(c){ c=soDig(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  for(let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+=c[i]*(t+1-i); if(((s*10)%11)%10!=c[t]) return false; } return true; }
function cnpjValido(c){ c=soDig(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)==c[12] && calc(13)==c[13]; }

async function upload(clienteId, ordemId, tipo, file){
  if(!file) return null;
  if(file.size > 15*1024*1024) throw new Error('Arquivo maior que 15 MB.');
  const ext = (file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = `${clienteId}/${ordemId}/${tipo}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false, contentType:file.type||undefined });
  if(error) throw error;
  return path;
}
async function abrirArquivo(path){
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300);
  if(error){ w && w.close(); return toast(error.message, true); }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

// mostra no menu só o que cabe; o resto vai para "Mais"
function ajustarNav(){
  const nav=$('#nav'); if(!nav||!S.navItems) return;
  const bts=[...nav.querySelectorAll('button[data-tab]')], mais=$('#navMais');
  bts.forEach(b=>b.style.display=''); mais.style.display='none';
  let ocultos=[];
  const cel=matchMedia('(max-width:700px)').matches;
  if(cel){ ocultos=bts.slice(4); }
  else if(nav.scrollWidth>nav.clientWidth+1){
    mais.style.display='';
    for(let i=bts.length-1;i>=0 && nav.scrollWidth>nav.clientWidth+1;i--){ bts[i].style.display='none'; ocultos.unshift(bts[i]); }
  }
  ocultos.forEach(b=>b.style.display='none');
  mais.style.display = (ocultos.length||cel)?'':'none';
  S.navOcultos = ocultos.map(b=>b.dataset.tab);
  marcarNav();
}

  const nav=$('#nav'); if(!nav) return;

  else { menu.style.top=''; menu.style.left=''; }

}

function vPainel(){
  const now=new Date(), ini=new Date(now.getFullYear(),now.getMonth(),1);
  const conc = S.ordens.filter(o=>o.status==='concluida');
  const mes = conc.filter(o=>new Date(o.concluida_em)>=ini);
  const pipe = S.ordens.filter(o=>['enviada','nota_emitida','pago_cliente','favorecidos_pagos'].includes(o.status));
  const cnt = s => S.ordens.filter(o=>o.status===s).length;
  const fatMes = mes.reduce((a,o)=>a+Number(o.valor_taxa),0);
  const fatPipe = pipe.reduce((a,o)=>a+Number(o.valor_taxa),0);
  const volMes = mes.reduce((a,o)=>a+Number(o.valor_pagamento),0);
  const acao = S.ordens.filter(o=>['enviada','pago_cliente','favorecidos_pagos'].includes(o.status));

// ===== apoio: empresa, texto "por conta e ordem", PIX, QR =====
const TEXTO_REPASSE_PADRAO = 'Premiação ordem {ORDEM} – por conta e ordem de {CLIENTE}';
async function cfgEmpresa(){
  if(!S.cfgNota){ const {data}=await sb.from('prem_config').select('*').single(); S.cfgNota=data||{}; }
  return S.cfgNota;
}
function textoRepasse(cfg, o, cliente){
  return (cfg.texto_repasse||TEXTO_REPASSE_PADRAO).replace(/\{ORDEM\}/g, o.numero).replace(/\{CLIENTE\}/g, cliente||'')
    .replace(/\{CAMPANHA\}/g, o.prem_campanhas?.nome||'').slice(0,140);
}
function hojeIso(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
async function copiar(t, msg){ try{ await navigator.clipboard.writeText(t); toast(msg||'Copiado.'); }catch(e){ toast('Não consegui copiar automaticamente: selecione e copie.',true); } }
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function pixPayload({chave,nome,cidade,valor,txid}){
  const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').trim().toUpperCase();
  let k=String(chave||'').trim();
  if(/^[\d.\-\/ ]+$/.test(k) && [11,14].includes(k.replace(/\D/g,'').length)) k=k.replace(/\D/g,'');   // CPF/CNPJ sem pontuação
  else if(/^\(?\d{2}\)?[\d \-]{8,11}$/.test(k)) k='+55'+k.replace(/\D/g,'');                             // telefone
  else if(k.includes('@')) k=k.toLowerCase();
  const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',k))+tlv('52','0000')+tlv('53','986')
    +(Number(valor)>0?tlv('54',Number(valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',norm(nome).slice(0,25)||'MAYWAY')
    +tlv('60',norm(cidade).slice(0,15)||'BELO HORIZONTE')+tlv('62',tlv('05',String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return p+crc16(p);
}
let _qrLib;
function desenharQr(el, texto){
  _qrLib = _qrLib || new Promise((ok,nok)=>{ if(window.maywayQrSvg) return ok(); const sc=document.createElement('script');
    sc.src='vendor/qrcode.js'; sc.onload=ok; sc.onerror=nok; document.head.appendChild(sc); });
  _qrLib.then(()=>{ el.innerHTML=window.maywayQrSvg(texto); })
    .catch(()=>{ _qrLib=null; el.innerHTML='<div class="small muted" style="padding:10px">Use o “PIX copia e cola”.</div>'; });
}

function mascCpf(c){ const d=String(c||'').replace(/\D/g,''); return d.length===11?`***.${d.slice(3,6)}.${d.slice(6,9)}-**`:fmtDoc(c); }
function textoNfse(o, itens, cliente, cfg){
  cfg=cfg||{}; const f=v=>brl(v).replace(/\u00a0/g,' ');
  const rep_=Number(o.valor_pagamento), tx=Number(o.valor_taxa), ted=Number(o.custo_transferencia||0);
  const linhas=[`Campanha de Incentivo – ${o.prem_campanhas?.nome||''} – Ordem nº ${o.numero}`, `Valor Total: ${f(rep_+tx+ted)}`, 'Sendo:', '',
    `• Premiações pagas aos favorecidos em nome e por conta e ordem de ${cliente}: ${f(rep_)}`,
    `• Taxa de administração da campanha: ${f(tx)}`];
  if(ted) linhas.push(`• Custo de transferência (TED): ${f(ted)}`);
  linhas.push('', 'Pagamentos realizados por conta e ordem do tomador:');
  (itens||[]).forEach(i=>linhas.push(`- ${i.nome} – CPF ${mascCpf(i.cpf)} – ${dIso(i.pago_em)} – ${f(i.valor)}`));
  linhas.push('', 'Observações:', `- Base de cálculo do ISS: ${f(tx)} (somente a taxa de administração).`,
    `- Deduções: ${f(rep_+ted)} – valores repassados a terceiros por conta e ordem do tomador${ted?' e tarifas de transferência':''}, comprovados por documentos, que não constituem receita do prestador.`,
    `- Serviço já quitado pelo tomador via PIX. Comprovantes vinculados à ordem nº ${o.numero}.`);
  return linhas.join('\n');
}

    const anexo=await upload(cliente_id,id,'ordem',$('#nFile').files[0]);
    const campanha=$('#nCamp')?.value; if(!campanha) throw new Error('Escolha a campanha desta ordem. Sem campanha aprovada não é possível enviar ordens.');
    const {error}=await sb.rpc('prem_criar_ordem',{ p_id:id, p_cliente:cliente_id, p_campanha:campanha, p_descricao:$('#nDesc').value.trim(),
      p_vencimento:$('#nVenc').value||null, p_observacao:$('#nObs').value.trim()||null, p_anexo:anexo,
      p_itens:itens.map(i=>({favorecido_id:i.fav, valor:parseValor(i.valor)})) });
    if(error) throw error;
    NOVA.itens=[]; toast('Ordem enviada!'); await carregar(); ir(S.papel==='admin'?'ordens':'minhas');
  });};
}
function cliNova(){ return S.papel==='admin' ? ($('#nCli')?.value||'') : S.clienteId; }
function favsDe(cli){ return S.favs.filter(f=>f.cliente_id===cli); }
function desenharItens(){
  const cli=cliNova(), lista=favsDe(cli);
  $('#nItens').innerHTML = !cli ? `<p class="muted">Selecione o cliente para ver os favorecidos.</p>` :
    !lista.length ? `<p class="muted">Nenhum favorecido cadastrado ainda. Clique em <b>+ Cadastrar favorecido</b>.</p>` :
    NOVA.itens.map((it,ix)=>{ const f=lista.find(x=>x.id===it.fav);
      return `<div class="row itemrow" style="grid-template-columns:2fr 1fr auto;align-items:end;margin-bottom:8px">
        <div><select data-fav="${ix}"><option value="">Escolha o favorecido…</option>${lista.map(x=>`<option value="${x.id}" ${x.id===it.fav?'selected':''}>${esc(x.nome)} · ${esc(fmtDoc(x.cpf))} · ${x.forma_pagamento==='pix'?'PIX':'TED'}</option>`).join('')}</select>
          ${f?`<div class="muted small" style="margin-top:4px">${esc(favDados(f))}${f.forma_pagamento==='ted'?` · <b>+${brl(S.custoTed)} de TED</b>`:''}</div>`:''}</div>
        <div><input data-val="${ix}" inputmode="decimal" placeholder="Valor R$" value="${esc(it.valor)}"></div>
        <button type="button" class="btn sm danger" data-rm="${ix}" title="Remover">✕</button></div>`; }).join('');
  document.querySelectorAll('[data-fav]').forEach(s=>s.onchange=()=>{ NOVA.itens[s.dataset.fav].fav=s.value; desenharItens(); });
  document.querySelectorAll('[data-val]').forEach(s=>s.oninput=()=>{ NOVA.itens[s.dataset.val].valor=s.value; calcNova(); });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ NOVA.itens.splice(b.dataset.rm,1); if(!NOVA.itens.length) NOVA.itens.push({fav:'',valor:''}); desenharItens(); });
  calcNova();
}
function calcNova(){
  const cli=cliNova(), t = S.papel==='admin' ? Number(S.clientes.find(c=>c.id===cli)?.taxa_percentual||0) : Number(S.cliente?.taxa_percentual||0);
  let v=0, teds=0; NOVA.itens.forEach(i=>{ const val=parseValor(i.valor); v+=val; const f=S.favs.find(x=>x.id===i.fav); if(f&&f.forma_pagamento==='ted') teds++; });
  const tx=Math.round(v*t)/100, ct=teds*S.custoTed;
  $('#nCalc').innerHTML=`<div>Total a pagar<b>${brl(v)}</b></div><div>Taxa de serviço (${pct(t)})<b>${brl(tx)}</b></div>`+
    `<div>Custo TED (${teds} × ${brl(S.custoTed)})<b>${brl(ct)}</b></div><div>Valor total<b>${brl(v+tx+ct)}</b></div>`;
}

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const f=S.favs.find(x=>x.id===b.dataset.del);

      <button class="btn danger" id="rmOk">Remover</button> <button class="btn" onclick="fecharModal()">Voltar</button>`);
    $('#rmOk').onclick=()=>busy($('#rmOk'),async()=>{ const {error}=await sb.from('prem_favorecidos').update({ativo:false}).eq('id',f.id); if(error) throw error;
      fecharModal(); await carregar(); vFavorecidos(); }); });

function formFav(id, clienteId, onSaved){
  const f = S.favs.find(x=>x.id===id) || {forma_pagamento:'pix', pix_tipo:'cpf'};
  abrirModal(`<h1>${id?'Editar favorecido':'Novo favorecido'}</h1>
    <form id="fvForm">
      <div class="row"><div class="f"><label>Nome completo</label><input id="fvNome" required value="${esc(f.nome||'')}"></div>
      <div class="f"><label>CPF</label><input id="fvCpf" required inputmode="numeric" placeholder="000.000.000-00" value="${esc(fmtDoc(f.cpf||''))}"></div></div>
      <div class="f"><label>Forma de pagamento</label>
        <select id="fvForma"><option value="pix">PIX (preferencial, sem custo)</option><option value="ted">TED (custo de ${brl(S.custoTed)})</option></select></div>
      <div id="fvPix" class="row"><div class="f"><label>Tipo de chave</label><select id="fvPixTipo">${Object.entries(PIX_TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="f"><label>Chave PIX</label><input id="fvPixChave" value="${esc(f.pix_chave||'')}"></div></div>
      <div id="fvTed"><div class="row"><div class="f"><label>Banco (nome ou código)</label><input id="fvBanco" value="${esc(f.banco||'')}"></div>
        <div class="f"><label>Tipo de conta</label><select id="fvTipoConta"><option value="corrente">Corrente</option><option value="poupanca">Poupança</option></select></div></div>
        <div class="row"><div class="f"><label>Agência</label><input id="fvAg" value="${esc(f.agencia||'')}"></div>
        <div class="f"><label>Conta com dígito</label><input id="fvConta" value="${esc(f.conta||'')}"></div></div></div>
      <div id="fvMsg"></div>
      <button class="btn pri" id="fvBtn">Salvar</button>
    </form>`);
  $('#fvForma').value=f.forma_pagamento; $('#fvPixTipo').value=f.pix_tipo||'cpf'; $('#fvTipoConta').value=f.tipo_conta||'corrente';
  const alterna=()=>{ const pix=$('#fvForma').value==='pix'; $('#fvPix').classList.toggle('hidden',!pix); $('#fvTed').classList.toggle('hidden',pix); };
  $('#fvForma').onchange=alterna; alterna();
  $('#fvPixTipo').onchange=()=>{ if($('#fvPixTipo').value==='cpf' && !$('#fvPixChave').value) $('#fvPixChave').value=soDig($('#fvCpf').value); };
  $('#fvForm').onsubmit=e=>{ e.preventDefault(); busy($('#fvBtn'),async()=>{
    const cpf=soDig($('#fvCpf').value);
    if(!(cpfValido(cpf)||cnpjValido(cpf))) throw new Error('CPF inválido. Confira os números.');
    const forma=$('#fvForma').value;
    const row={ nome:$('#fvNome').value.trim(), cpf, forma_pagamento:forma };
    if(forma==='pix'){ row.pix_tipo=$('#fvPixTipo').value; row.pix_chave=$('#fvPixChave').value.trim() || (row.pix_tipo==='cpf'?cpf:'');
      if(!row.pix_chave) throw new Error('Informe a chave PIX.'); }
    else { row.banco=$('#fvBanco').value.trim(); row.agencia=$('#fvAg').value.trim(); row.conta=$('#fvConta').value.trim(); row.tipo_conta=$('#fvTipoConta').value;
      if(!row.banco||!row.agencia||!row.conta) throw new Error('Preencha banco, agência e conta.'); }
    let res;
    if(id) res = await sb.from('prem_favorecidos').update(row).eq('id',id).select().single();
    else { row.cliente_id=clienteId; res = await sb.from('prem_favorecidos').insert(row).select().single(); }
    if(res.error) throw new Error(res.error.code==='23505'?'Já existe um favorecido com esse CPF.':res.error.message);
    fecharModal(); toast('Favorecido salvo.'); await carregar(); onSaved && onSaved(res.data);
  });};
}

// ================= CAMPANHAS =================
const CST = { em_analise:['Em análise','st-enviada'], ajustes:['Ajustes solicitados','st-cancelada'], aprovada:['Aprovada','st-concluida'], reprovada:['Reprovada','st-cancelada'] };
const hoje = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const dataDe = s => new Date(s+'T00:00:00');
const diasAte = s => Math.round((dataDe(s)-hoje())/86400000);
function campsValidas(cli){ const pz=Number(S.prazoPos??30);
  return S.camps.filter(c=>c.cliente_id===cli && c.status==='aprovada' && diasAte(c.periodo_inicio)<=0 && diasAte(c.periodo_fim)>=-pz); }
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function fimMax(ini){ const d=dataDe(ini); d.setMonth(d.getMonth()+(S.durMax||3)); d.setDate(d.getDate()-1); return isoD(d); }
function podeRenovar(c){ if(c.status!=='aprovada' || S.camps.some(x=>x.renovada_de===c.id)) return false;
  const d=diasAte(c.periodo_fim); return d<=(S.avisoRen??15) && d>=-(S.prazoPos??30); }
function periodoRenov(c){ const d=dataDe(c.periodo_fim); d.setDate(d.getDate()+1); const ini=isoD(d); return [ini, fimMax(ini)]; }
function renovarCampanha(id){
  const c=S.camps.find(x=>x.id===id); const [ini,fim]=periodoRenov(c);
  abrirModal(`<h1>Repetir a campanha "${esc(c.nome)}"?</h1>
    <p>Vamos criar a mesma campanha, com o mesmo briefing e regulamento, para o próximo período:</p>
    <div class="calc"><div>Novo período<b>${dIso(ini)} a ${dIso(fim)}</b></div><div>Duração<b>${S.durMax||3} meses</b></div></div>
    <p class="muted small">A repetição já nasce aprovada. Se quiser mudar participantes, metas ou critérios, cadastre uma campanha nova em vez de repetir.</p>
    <button class="btn pri" id="rnOk">Sim, repetir por mais ${S.durMax||3} meses</button> <button class="btn" onclick="fecharModal()">Agora não</button>`);
  $('#rnOk').onclick=()=>busy($('#rnOk'),async()=>{ const {error}=await sb.rpc('prem_renovar_campanha',{p_campanha:id}); if(error) throw error;
    fecharModal(); toast('Campanha repetida até '+dIso(fim)+'.'); await carregar(); ir(S.tab); });
}
function campSituacao(c){
  if(c.status!=='aprovada') return `<span class="pill ${CST[c.status][1]}">${CST[c.status][0]}</span>`;
  const pz=Number(S.prazoPos??30);
  if(diasAte(c.periodo_inicio)>0) return `<span class="pill st-nota_emitida">Aprovada · começa ${dIso(c.periodo_inicio)}</span>`;
  if(diasAte(c.periodo_fim)>=0) return `<span class="pill st-concluida">Em andamento</span>`;
  if(diasAte(c.periodo_fim)>=-pz) return `<span class="pill st-pago_cliente">Encerrada · ordens até ${new Date(dataDe(c.periodo_fim).getTime()+pz*86400000).toLocaleDateString('pt-BR')}</span>`;
  return `<span class="pill st-cancelada">Encerrada</span>`;
}
function regulamento(emp){
  emp = emp || 'A empresa';
  return [`Ao participar, o colaborador declara conhecer e concordar com todas as regras desta campanha.`,
    `${emp} poderá ajustar objetivos e critérios quando necessário, comunicando antes todos os participantes.`,
    `Os prêmios têm natureza de incentivo e reconhecimento por desempenho superior ao ordinariamente esperado, não integram a remuneração e não se incorporam ao salário, nos termos do art. 457, §§ 2º e 4º, da CLT (redação da Lei nº 13.467/2017).`,
    `Situações não previstas neste briefing serão decididas pela diretoria de ${emp}.`];
}
function desenharCamp(){
  const box=$('#nCampBox'); if(!box) return;
  const admin=S.papel==='admin', cli=cliNova(), lista=cli?campsValidas(cli):[];
  if(!cli){ box.innerHTML='<p class="muted" style="margin:0">Selecione o cliente.</p>'; return; }
  if(!lista.length){
    box.innerHTML = `<div class="msg err" style="margin:0">Não há campanha aprovada e vigente${admin?' para este cliente':''}. Sem campanha não é possível enviar ordens.
      ${admin?'':' <button type="button" class="link" onclick="formCampanha()">Preencher briefing da campanha</button>'}</div>`;
    $('#nBtn') && ($('#nBtn').disabled=true); return; }
  $('#nBtn') && ($('#nBtn').disabled=false);
  box.innerHTML = `<select id="nCamp" required>${lista.length>1?'<option value="">Escolha a campanha…</option>':''}${lista.map(c=>`<option value="${c.id}">${esc(c.nome)} · ${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</option>`).join('')}</select>`;
}
function vCampanhas(){
  const admin=S.papel==='admin';
  const f = S.campFiltro===undefined ? (admin && S.camps.some(c=>c.status==='em_analise') ? 'em_analise' : '') : S.campFiltro;
  const lista=S.camps.filter(c=>!f||c.status===f);
  const pagoPor = id => S.ordens.filter(o=>o.campanha_id===id && o.status!=='cancelada').reduce((a,o)=>a+Number(o.valor_pagamento),0);
  $('#main').innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Campanhas</h1><div class="spacer"></div>
      <select id="cpF" style="width:auto"><option value="">Todas</option>${Object.entries(CST).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
      <button class="btn pri" onclick="formCampanha()">+ Nova campanha</button></div>
    <p class="muted" style="margin-top:-6px">Toda ordem de pagamento precisa estar ligada a uma campanha aprovada. Duração máxima: ${S.durMax||3} meses; ordens aceitas até ${S.prazoPos??30} dias após o fim.</p>
    <div class="card">${lista.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Nº</th>${admin?'<th>Cliente</th>':''}<th>Campanha</th><th>Período</th><th class="num">Orçamento</th><th class="num">Pago</th><th>Situação</th></tr></thead><tbody>
      ${lista.map(c=>`<tr class="click" data-camp="${c.id}"><td>#${c.numero}</td>${admin?`<td>${esc(c.prem_clientes?.nome)}</td>`:''}<td><b>${esc(c.nome)}</b>${c.renovada_de?` <span class="muted small">· repetição de #${S.camps.find(x=>x.id===c.renovada_de)?.numero??''}</span>`:''}${podeRenovar(c)?' <span class="pill st-enviada">Terminando</span>':''}<div class="muted small">${esc(c.participantes).slice(0,80)}</div></td>
        <td>${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</td><td class="num">${c.orcamento_previsto?brl(c.orcamento_previsto):'—'}</td><td class="num">${brl(pagoPor(c.id))}</td><td>${campSituacao(c)}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty">${f?'Nenhuma campanha com esse status.':'Nenhuma campanha cadastrada ainda.'}</div>`}</div>`;
  $('#cpF').value=f; $('#cpF').onchange=e=>{ S.campFiltro=e.target.value; vCampanhas(); };
  document.querySelectorAll('[data-camp]').forEach(tr=>tr.onclick=()=>detalheCampanha(tr.dataset.camp));
}
function detalheCampanha(id){
  const c=S.camps.find(x=>x.id===id); if(!c) return;
  const admin=S.papel==='admin';
  const ords=S.ordens.filter(o=>o.campanha_id===id && o.status!=='cancelada');
  const pago=ords.reduce((a,o)=>a+Number(o.valor_pagamento),0);
  const emp = admin ? c.prem_clientes?.nome : S.cliente?.nome;
  const bloco=(t,v)=>v?`<h2 style="margin:16px 0 6px">${t}</h2><div style="white-space:pre-wrap">${esc(v)}</div>`:'';
  abrirModal(`
    <div class="muted small">Campanha #${c.numero}${admin?' · '+esc(emp):''}</div>
    <h1 style="margin:4px 0 6px">${esc(c.nome)}</h1>
    <div>${campSituacao(c)}</div>
    ${c.parecer&&c.status!=='aprovada'?`<div class="msg err" style="margin-top:12px">${esc(c.parecer)}</div>`:''}
    <dl class="dl" style="margin-top:16px">
      <dt>Período</dt><dd>${dIso(c.periodo_inicio)} a ${dIso(c.periodo_fim)}</dd>
      <dt>Orçamento previsto</dt><dd>${c.orcamento_previsto?brl(c.orcamento_previsto):'—'}</dd>
      <dt>Já pago em ordens</dt><dd>${brl(pago)} <span class="muted">(${ords.length} ordens)</span></dd>
      ${c.aprovada_em?`<dt>Aprovada em</dt><dd>${dth(c.aprovada_em)}</dd>`:''}
    </dl>
    ${bloco('1. Participantes',c.participantes)}${bloco('2. Objetivos',c.objetivos)}${bloco('3. Critérios de avaliação',c.criterios_avaliacao)}
    ${bloco('4. Critérios de premiação',c.criterios_premiacao)}${bloco('5. Formas de bonificação',c.formas_bonificacao)}${bloco('Considerações adicionais',c.consideracoes)}
    <h2 style="margin:16px 0 6px">Regulamento</h2><ul class="small" style="margin:0;padding-left:18px">${regulamento(emp).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <p class="small muted">Aceito em ${dth(c.aceite_em)}.</p>
    ${c.logo?`<button class="btn sm" data-file="${esc(c.logo)}">📎 Logo da empresa</button>`:''}
    ${admin && c.status!=='aprovada' ? `<div class="action" style="margin-top:16px"><h2>Análise</h2>
      <div class="f"><label>Parecer / ajustes necessários</label><textarea id="cpPar">${esc(c.parecer||'')}</textarea></div>
      <button class="btn pri" data-st="aprovada">Aprovar campanha</button> <button class="btn" data-st="ajustes">Pedir ajustes</button> <button class="btn danger" data-st="reprovada">Reprovar</button></div>`:''}
    ${admin && c.status==='aprovada' ? `<div style="margin-top:16px"><button class="btn sm" data-st="ajustes">Reabrir para ajustes</button></div>`:''}
    ${podeRenovar(c) ? `<div class="action" style="margin-top:16px"><b>Esta campanha termina em ${dIso(c.periodo_fim)}.</b> Quer repetir por mais ${S.durMax||3} meses (${dIso(periodoRenov(c)[0])} a ${dIso(periodoRenov(c)[1])})?<div style="margin-top:10px"><button class="btn pri" id="cpRen">Repetir campanha</button></div></div>`:''}
    ${!admin && ['em_analise','ajustes'].includes(c.status) ? `<div style="margin-top:16px"><button class="btn" id="cpEd">Editar briefing</button></div>`:''}
    ${admin ? `<div style="margin-top:8px"><button class="btn sm" id="cpEd">Editar briefing</button></div>`:''}`);
  document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>abrirArquivo(b.dataset.file));

  $('#cpRen') && ($('#cpRen').onclick=()=>renovarCampanha(id));
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>busy(b,async()=>{

    if(st!=='aprovada' && !par && $('#cpPar')) throw new Error('Escreva no parecer o que precisa ser ajustado.');
    const {error}=await sb.from('prem_campanhas').update({status:st, parecer:par||c.parecer||null}).eq('id',id);
    if(error) throw error; toast(st==='aprovada'?'Campanha aprovada. O cliente já pode enviar ordens.':'Campanha atualizada.'); fecharModal(); await carregar(); ir(S.tab);
  }));
}
function formCampanha(id){
  const admin=S.papel==='admin';
  const c=S.camps.find(x=>x.id===id) || {};
  const t=(k,l,dica,req=true)=>`<div class="f"><label>${l}</label><textarea id="cp_${k}" ${req?'required':''} placeholder="${esc(dica)}">${esc(c[k]||'')}</textarea></div>`;
  const emp = admin ? (S.clientes.find(x=>x.id===(c.cliente_id||S.favCli))?.nome) : S.cliente?.nome;

      consideracoes:$('#cp_consideracoes').value.trim()||null, orcamento_previsto:parseValor($('#cp_orc').value)||null };
    const lf=$('#cp_logo').files[0]; if(lf) row.logo=await upload(cli,'campanhas/'+cid,'logo',lf);
    const res = id ? await sb.from('prem_campanhas').update(row).eq('id',id) : await sb.from('prem_campanhas').insert({...row, id:cid, cliente_id:cli});
    if(res.error) throw res.error;

function mdHtml(t){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out='', inList=false;
  for(const raw of String(t||'').split('\n')){
    const l=raw.trimEnd();
    const li=l.match(/^\d+\.\s+(.*)$/);
    if(li){ if(!inList){ out+='<ol>'; inList=true; } out+=`<li>${inl(li[1])}</li>`; continue; }
    if(inList){ out+='</ol>'; inList=false; }
    if(!l) continue;
    if(l.startsWith('## ')) out+=`<h3>${inl(l.slice(3))}</h3>`;
    else if(l.startsWith('# ')) out+=`<h2 style="text-align:center">${inl(l.slice(2))}</h2>`;
    else out+=`<p>${inl(l)}</p>`;
  }
  if(inList) out+='</ol>';
  return out;
}

async function pushStatus(){

}
async function desenharPainelNotif(){

async function abrirNotificacao(n){

async function abrirDestino(tipo, id){
  if(!tipo) return;

}
function b64ToU8(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
async function ativarPush(){
  const perm=await Notification.requestPermission(); if(perm!=='granted') throw new Error('Permissão de notificação não concedida.');
  const reg=await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC)});
  const j=sub.toJSON();
  const {error}=await sb.from('prem_push_subs').upsert({endpoint:j.endpoint, user_id:S.user.id, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0,300)});
  if(error) throw error; toast('Notificações ativadas neste aparelho.'); desenharPainelNotif();
}
async function desativarPush(){ try{ const reg=await navigator.serviceWorker.getRegistration(); const s=reg&&await reg.pushManager.getSubscription();
  if(s){ await sb.from('prem_push_subs').delete().eq('endpoint',s.endpoint); await s.unsubscribe(); } }catch(e){} toast('Notificações desativadas neste aparelho.'); desenharPainelNotif(); }

if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e=>{ if(e.data && e.data.tipo==='abrir'){ const m=String(e.data.url||'').match(/#(ordem|campanha|contrato)-([0-9a-f-]{36})$/); if(m && S.papel) abrirDestino(m[1],m[2]); } });

        ${Object.entries(porCli).sort((a,b)=>b[1].fat-a[1].fat).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${brl(v.vol)}</td><td class="num"><b>${brl(v.fat)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>Mês a mês</h2><table class="tbl"><thead><tr><th>Mês</th><th class="num">Ordens</th><th class="num">Volume</th><th class="num">Faturamento</th></tr></thead><tbody>
        ${meses.map(k=>`<tr><td>${nomeMes(k)}</td><td class="num">${porMes[k].n}</td><td class="num">${brl(porMes[k].vol)}</td><td class="num"><b>${brl(porMes[k].fat)}</b></td></tr>`).join('')}</tbody></table></div>
    </div>`}`;
  if(meses.length){
    $('#fMes').value=sel; $('#fMes').onchange=e=>{S.fatMes=e.target.value; vFaturamento();};
    $('#fCsv').onclick=()=>{ const b=new Blob(['﻿'+csv()],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`faturamento-${sel}.csv`; a.click(); };
  }
}

iniciar();
</script>
